<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Windmill extension settings</title>
		<style>
			body {
				font:
					14px system-ui,
					sans-serif;
				margin: 24px;
				max-width: 480px;
			}
			input {
				width: 100%;
				padding: 6px;
				margin: 8px 0;
				box-sizing: border-box;
			}
		</style>
	</head>
	<body>
		<form id="form">
			<label for="url">Windmill instance URL</label>
			<input id="url" type="url" placeholder="https://app.windmill.dev" required />
			<button type="submit">Save</button>
			<p id="status"></p>
		</form>
		<script type="module" src="options.js"></script>
	</body>
</html>
