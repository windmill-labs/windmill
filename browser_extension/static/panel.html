<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Windmill</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				font:
					13px system-ui,
					sans-serif;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			iframe {
				flex: 1;
				border: 0;
				width: 100%;
			}
			#setup {
				padding: 16px;
			}
			#confirm {
				padding: 12px;
				border-top: 2px solid #c2410c;
				background: #fff7ed;
				color: #1c1917;
			}
			#confirm p {
				margin: 0 0 8px;
				word-break: break-word;
			}
			#confirm .host {
				color: #57534e;
			}
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div id="setup" hidden>
			<p>Set the URL of your Windmill instance to start.</p>
			<button id="open-options">Open settings</button>
		</div>
		<iframe id="frame" title="Windmill" hidden></iframe>
		<div id="confirm" role="alertdialog" aria-labelledby="confirm-text" hidden>
			<p id="confirm-text"></p>
			<p class="host" id="confirm-host"></p>
			<button id="allow">Allow</button>
			<button id="deny">Deny</button>
		</div>
		<script type="module" src="panel.js"></script>
	</body>
</html>
