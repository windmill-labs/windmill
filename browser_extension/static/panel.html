<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Windmill</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			html,
			body {
				height: 100%;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			iframe {
				flex: 1;
				border: 0;
				width: 100%;
			}
			#setup {
				margin: 24px 16px;
			}
			#setup p {
				margin: 0 0 16px;
				color: var(--secondary);
			}
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div id="setup" class="card" hidden>
			<div class="brand">
				<img src="logo.svg" alt="" />
				<h1>Windmill</h1>
			</div>
			<p>Connect the extension to your Windmill instance to start a session.</p>
			<button id="open-options">Set up</button>
		</div>
		<iframe id="frame" title="Windmill" hidden></iframe>
		<script type="module" src="panel.js"></script>
	</body>
</html>
