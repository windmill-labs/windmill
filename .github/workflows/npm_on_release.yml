name: Publish typescript-client & CLI to NPM on release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Every job publishes by npm trusted publishing (OIDC). npm accepts it only from GitHub-hosted
# runners with npm >= 11.5.1, and matches this file name and the `npm` environment: changing
# any of these breaks releases, there is no token to fall back on.
jobs:
  publish_typescript_client:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: cd typescript-client && ./publish.sh --access=public && cd ..
  publish_chat_sdk:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: cd chat-sdk && npm ci && npm run build && npm publish --access public
  publish_cli:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: cd cli && ./build.sh && cd npm && npm publish --access public
