on:
  push:
    branches: [main]

name: release-please
jobs:
  release-please:
    name: "Release please"
    runs-on: ubicloud
    steps:
      # Release config lives in release-please-config.json /
      # .release-please-manifest.json rather than in a `release-type` input: the
      # input path re-derives the last released version by paginating every
      # GitHub release (1400+ here, ~120 GraphQL pages per run, which
      # intermittently dies on `fetch failed`), the manifest file is read directly.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
