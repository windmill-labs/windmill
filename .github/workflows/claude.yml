name: Fast Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # author_association misses private org members; check-access resolves them via the
  # internal app token. Both are OR'd below so public members still pass instantly.
  check-access:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/ai') && !startsWith(github.event.comment.body, '/ai-fast')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/ai') && !startsWith(github.event.comment.body, '/ai-fast')) ||
      (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '/ai') && !startsWith(github.event.review.body, '/ai-fast')) ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '/ai') && !startsWith(github.event.issue.body, '/ai-fast'))
    uses: ./.github/workflows/check-write-access.yml
    with:
      username: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
    secrets: inherit

  # The agent runs with unrestricted Bash and reads PR text anyone can write, so a job
  # that references WINDMILL_EE_PRIVATE_ACCESS hands it that token: the runner holds
  # every secret its job references (a skipped step's included) in process memory. EE is
  # therefore checked out only in a separate job, and only for PRs whose head branch
  # lives in this repo; forks, issues and token-less runs take the job without it.
  # Comments on a same-repo PR still reach the EE job; that exposure remains.
  pr-info:
    needs: [check-access]
    if: |
      needs.check-access.outputs.authorized == 'true' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ee_repo_ref: ${{ steps.pr.outputs.ee_repo_ref }}
    steps:
      # The EE ref is read from the PR head's backend/ee-repo-ref.txt (via the API, so it
      # reflects the PR's EE pin regardless of which ref the agent job checks out).
      - name: Resolve EE ref for same-repo PRs
        id: pr
        env:
          HAS_EE_TOKEN: ${{ secrets.WINDMILL_EE_PRIVATE_ACCESS != '' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$HAS_EE_TOKEN" != "true" ] || [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          # Fails for a plain issue, which gets no EE.
          PR=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER") || exit 0
          # head.repo is null when the fork was deleted.
          if [ "$(jq -r '.head.repo.full_name' <<<"$PR")" != "${{ github.repository }}" ]; then
            echo "PR head is not in this repo; running without EE."
            exit 0
          fi
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR")
          REF=$(gh api "repos/${{ github.repository }}/contents/backend/ee-repo-ref.txt?ref=$HEAD_SHA" --jq .content | base64 -d | tr -d '[:space:]') || true
          echo "ee_repo_ref=$REF" >> "$GITHUB_OUTPUT"

  claude-code-action-ee:
    needs: [pr-info]
    if: needs.pr-info.outputs.ee_repo_ref != ''
    runs-on: ubicloud-standard-8
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Make the EE source (the *_ee.rs files in the companion repo) available so the
      # reviewer can see EE-only code (e.g. windmill-queue/src/jobs_ee.rs), not just the
      # CE surface.
      - name: Checkout EE repository
        uses: actions/checkout@v4
        with:
          repository: windmill-labs/windmill-ee-private
          path: ./windmill-ee-private
          ref: ${{ needs.pr-info.outputs.ee_repo_ref }}
          token: ${{ secrets.WINDMILL_EE_PRIVATE_ACCESS }}
          fetch-depth: 1
          persist-credentials: false

      - name: Substitute EE code
        run: ./backend/substitute_ee_code.sh --copy --dir ./windmill-ee-private

      - name: Run Claude PR Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "windmill-internal-app[bot]"
          trigger_phrase: "/ai"
          settings: |
            {
              "env": {
                "SQLX_OFFLINE": "true"
              }
            }
          claude_args: |
            --allowedTools "Bash,WebFetch,WebSearch"
            --model claude-opus-5-5

  claude-code-action:
    needs: [pr-info]
    if: needs.pr-info.outputs.ee_repo_ref == ''
    runs-on: ubicloud-standard-8
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # claude-code-action installs its own git credential, so checkout's is not needed.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude PR Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "windmill-internal-app[bot]"
          trigger_phrase: "/ai"
          settings: |
            {
              "env": {
                "SQLX_OFFLINE": "true"
              }
            }
          claude_args: |
            --allowedTools "Bash,WebFetch,WebSearch"
            --model claude-opus-5-5
