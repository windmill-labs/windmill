# Weekly Dependabot triage
#
# Every Monday at 07:00 UTC (and on demand through workflow_dispatch) this workflow
# fetches every open Dependabot alert of the repository and runs Claude Code to triage
# them against Windmill's vulnerability policy (.github/prompts/dependabot-triage.md).
#
# What a run produces:
#   - P3 alerts dismissed on GitHub with a comment (Claude writes
#     .dependabot-triage/dismissals.json; the "Apply dismissals" step applies it);
#   - at most ONE draft PR per ecosystem (branch security/dependabot-<ecosystem>-<date>,
#     title "chore(security): resolve Dependabot alerts in <manifest>") containing only
#     targeted, verified bumps, with the check results in the PR body;
#   - a thread in the support triage pipeline for everything that needs a person (P0, P1,
#     decisions, ambiguous fixes), exactly like a privately reported GitHub advisory:
#     Discord forum thread, sandboxed re-analysis, and a webmux fix job when the fix is
#     concrete (behind the pipeline's prompt-injection gate). P0/P1 also get a WIN Linear
#     ticket with the policy deadline. Claude writes .dependabot-triage/handoff.json; the
#     "Hand off" step POSTs it to f/security/dependabot_handoff in windmill-prod;
#   - one GitHub issue "Dependabot triage <date>" as the public record of the run.
#     A P0 finding produces only the hand-off and an issue titled
#     "[P0] Dependabot triage <date>" with no exploit detail.
#
# What a run never does: it never merges anything, never pushes to main and never edits
# .github/workflows/. The Claude step holds none of the tokens that dismiss alerts or
# reach Linear; those live in the two steps after it.
#
# Tokens:
#   - The alerts are read with the default GITHUB_TOKEN. This needs the
#     `vulnerability-alerts: read` job permission ("permits an action to list Dependabot
#     alerts for the repository" - GitHub Actions workflow syntax reference,
#     "permissions"). No PAT is required for reading.
#   - Dismissing needs write access, and `vulnerability-alerts` supports read only, so the
#     "Apply dismissals" step uses secrets.DEPENDABOT_ALERTS_TOKEN: a fine-grained PAT
#     for this repository with "Dependabot alerts: read and write" and nothing else.
#   - The hand-off uses secrets.WINDMILL_TRIAGE_TOKEN: a windmill-prod workspace token
#     for a user allowed to run f/security/dependabot_handoff.
#   - Claude authenticates with secrets.CLAUDE_CODE_OAUTH_TOKEN, like the other Claude
#     workflows in this directory, and `id-token: write` lets the action mint its own
#     GitHub App token for `gh pr create` / `gh issue create`.
name: Dependabot triage

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      alert_numbers:
        description: 'Comma-separated Dependabot alert numbers to triage (empty = every open alert)'
        required: false
        type: string
        default: ''

# Two runs must never overlap: they would open duplicate PRs and issues. A manual run
# queues behind a scheduled one instead of cancelling it.
concurrency:
  group: dependabot-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      vulnerability-alerts: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pages through GET /repos/{owner}/{repo}/dependabot/alerts (state=open) into
      # .dependabot-triage/alerts.json plus a compact alerts.tsv the prompt reads. The
      # directory is git-excluded locally so the triage PRs can never pick it up.
      - name: Fetch open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALERT_NUMBERS: ${{ inputs.alert_numbers }}
        run: |
          set -euo pipefail
          OUT=.dependabot-triage
          mkdir -p "$OUT"
          echo "$OUT/" >> .git/info/exclude

          gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" --paginate \
            | jq -s '[.[][]]' > "$OUT/all-open.json"

          # Optional subset: keep only the requested alert numbers (digits and commas only).
          if [ -n "$ALERT_NUMBERS" ]; then
            NUMS=$(printf '%s' "$ALERT_NUMBERS" | tr -cd '0-9,' | tr ',' '\n' | grep -E '^[0-9]+$' | jq -s '.' || echo '[]')
            jq --argjson nums "$NUMS" '[.[] | select(.number as $n | ($nums | index($n)) != null)]' \
              "$OUT/all-open.json" > "$OUT/alerts.json"
          else
            cp "$OUT/all-open.json" "$OUT/alerts.json"
          fi

          {
            printf 'number\tpackage\tecosystem\tmanifest\tseverity\tscope\tvulnerable_range\tfirst_patched\tghsa\tcve\tsummary\n'
            jq -r '.[] | [
                .number,
                .dependency.package.name,
                .dependency.package.ecosystem,
                .dependency.manifest_path,
                .security_advisory.severity,
                (.dependency.scope // ""),
                .security_vulnerability.vulnerable_version_range,
                (.security_vulnerability.first_patched_version.identifier // "none"),
                .security_advisory.ghsa_id,
                (.security_advisory.cve_id // ""),
                (.security_advisory.summary | gsub("[\t\r\n]+"; " "))
              ] | @tsv' "$OUT/alerts.json"
          } > "$OUT/alerts.tsv"

          TOTAL=$(jq length "$OUT/all-open.json")
          COUNT=$(jq length "$OUT/alerts.json")
          DATE=$(date -u +%Y-%m-%d)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          {
            echo "## Dependabot triage $DATE"
            echo
            echo "Open alerts: **$TOTAL**, selected for this run: **$COUNT**"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            jq -r 'group_by(.security_advisory.severity) | .[] | "| \(.[0].security_advisory.severity) | \(length) |"' "$OUT/alerts.json"
            echo
            echo "| Manifest | Count |"
            echo "|---|---|"
            jq -r 'group_by(.dependency.manifest_path) | .[] | "| \(.[0].dependency.manifest_path) | \(length) |"' "$OUT/alerts.json"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" = "0" ]; then
            echo "::notice::No open Dependabot alerts selected; skipping the triage."
          fi

      # Toolchains, only as far as the prompt's check commands need them
      # (docs/validation.md): frontend/validator/multiplayer via node, cli via bun,
      # backend via cargo check (SQLX_OFFLINE, as backend-check.yml), python-client via uv.
      - name: Setup node
        if: steps.alerts.outputs.count != '0'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup bun
        if: steps.alerts.outputs.count != '0'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # backend/.cargo/config.toml links with clang + mold; build scripts and proc-macros
      # still link under `cargo check`, so install both as backend-check.yml does.
      - name: Install mold and clang
        if: steps.alerts.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Setup rust
        if: steps.alerts.outputs.count != '0'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.97.0

      - name: Setup uv
        if: steps.alerts.outputs.count != '0'
        uses: astral-sh/setup-uv@v5

      - name: Install python 3.14
        if: steps.alerts.outputs.count != '0'
        run: uv python install 3.14

      # The policy lives in a committed file so it is reviewed like code. It is loaded
      # through GITHUB_ENV with a random delimiter (same pattern as pr-ready-review.yml).
      - name: Read triage prompt
        if: steps.alerts.outputs.count != '0'
        run: |
          delimiter="TRIAGE_PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "TRIAGE_PROMPT<<$delimiter"
            cat .github/prompts/dependabot-triage.md
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Triage alerts with Claude
        if: steps.alerts.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "env": {
                "SQLX_OFFLINE": "true"
              }
            }
          prompt: |
            REPO: ${{ github.repository }}
            RUN DATE (YYYY-MM-DD): ${{ steps.alerts.outputs.date }}
            BASE BRANCH: ${{ github.ref_name }}
            ALERTS SELECTED: ${{ steps.alerts.outputs.count }}
            ALERTS FILE: .dependabot-triage/alerts.tsv (full API payload in .dependabot-triage/alerts.json)
            SUBSET REQUESTED: ${{ inputs.alert_numbers || 'none - every open alert' }}

            ${{ env.TRIAGE_PROMPT }}
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --max-turns 200
            --model claude-opus-5

      # Claude only writes dismissals.json; this step holds the token that can dismiss.
      # Every entry is validated (shape, reason, and membership in this run's alert set)
      # before any request is sent, and comments are capped at GitHub's 280 characters.
      - name: Apply dismissals
        if: steps.alerts.outputs.count != '0' && hashFiles('.dependabot-triage/dismissals.json') != ''
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILE=.dependabot-triage/dismissals.json
          SELECTED=$(jq '[.[].number]' .dependabot-triage/alerts.json)
          jq -e --argjson sel "$SELECTED" '
            type == "array" and all(.[];
              (.alert | type == "number") and (.alert as $a | ($sel | index($a)) != null)
              and (.reason == "not_used" or .reason == "tolerable_risk")
              and (.comment | type == "string" and length > 0))' "$FILE" >/dev/null \
            || { echo "::error::dismissals.json is malformed or names alerts outside this run"; exit 1; }

          {
            echo "## Dismissals applied"
            echo
            echo "| alert | reason | result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED=0
          while IFS= read -r item; do
            n=$(jq -r '.alert' <<<"$item")
            reason=$(jq -r '.reason' <<<"$item")
            comment=$(jq -r '.comment[0:280]' <<<"$item")
            if out=$(gh api -X PATCH "repos/$REPO/dependabot/alerts/$n" \
                  -f state=dismissed -f "dismissed_reason=$reason" -f "dismissed_comment=$comment" \
                  --jq '.state' 2>&1); then
              echo "| $n | $reason | $out |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAILED=$((FAILED + 1))
              echo "| $n | $reason | failed: ${out:0:120} |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::alert $n could not be dismissed: $out"
            fi
          done < <(jq -c '.[]' "$FILE")
          [ "$FAILED" = "0" ] || echo "::warning::$FAILED dismissal(s) failed; see the summary"

      # Claude only writes handoff.json; this step POSTs it to the windmill-prod script that
      # starts one support-triage thread per item (origin `dependabot`) and creates the
      # P0/P1 Linear tickets. Thread ids and ticket markers are derived from the alert
      # numbers, so a re-run adds a follow-up to the same thread instead of a duplicate.
      - name: Hand off to the support triage pipeline
        if: steps.alerts.outputs.count != '0' && hashFiles('.dependabot-triage/handoff.json') != ''
        env:
          WM_TOKEN: ${{ secrets.WINDMILL_TRIAGE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FILE=.dependabot-triage/handoff.json
          jq -e '
            (.items | type == "array") and all(.items[];
              (.kind | IN("p0", "p1", "decision", "fix"))
              and (.alerts | type == "array" and length > 0)
              and (.title | type == "string" and length > 0)
              and (.summary | type == "string" and length > 0))' "$FILE" >/dev/null \
            || { echo "::error::handoff.json is malformed"; exit 1; }
          COUNT=$(jq '.items | length' "$FILE")
          if [ "$COUNT" = "0" ]; then
            echo "::notice::handoff.json has no items; nothing to hand off."
            exit 0
          fi
          BODY=$(jq --arg run_url "$RUN_URL" '{ handoff: (. + { run_url: $run_url }) }' "$FILE")
          RESP=$(curl -sS --fail-with-body -X POST \
            "https://app.windmill.dev/api/w/windmill-prod/jobs/run_wait_result/p/f/security/dependabot_handoff" \
            -H "Authorization: Bearer $WM_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          {
            echo "## Handed off ($COUNT items)"
            echo
            echo '```json'
            echo "$RESP" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
