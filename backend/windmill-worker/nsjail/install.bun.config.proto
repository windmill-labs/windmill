name: "bun install"

mode: ONCE
hostname: "bun"
log_level: ERROR
time_limit: {TIMEOUT}

# Bun/JavaScriptCore reserves large virtual ranges up front, and native builds
# size their pools to the host: an address-space cap breaks the install itself.
disable_rl: true

cwd: "{JOB_DIR}"

clone_newnet: false
clone_newuser: {CLONE_NEWUSER}

skip_setsid: true
keep_caps: false
keep_env: true
mount_proc: true

mount {
    src: "/bin"
    dst: "/bin"
	is_bind: true
}

mount {
    src: "/lib"
    dst: "/lib"
	is_bind: true
}

mount {
    src: "/lib64"
    dst: "/lib64"
	is_bind: true
    mandatory: false
}

mount {
    src: "/usr"
    dst: "/usr"
	is_bind: true
}

mount {
    src: "/etc"
    dst: "/etc"
	is_bind: true
}

# Container runtimes bind exactly these 3 files as separate submounts over
# /etc; nsjail's ro remount of /etc is non-recursive so they stay writable.
# Load-bearing -- do not remove as redundant with the /etc bind above.
mount {
    src: "/etc/resolv.conf"
    dst: "/etc/resolv.conf"
    is_bind: true
    mandatory: false
}

mount {
    src: "/etc/hosts"
    dst: "/etc/hosts"
    is_bind: true
    mandatory: false
}

mount {
    src: "/etc/hostname"
    dst: "/etc/hostname"
    is_bind: true
    mandatory: false
}

mount {
	src: "/dev/null"
	dst: "/dev/null"
	is_bind: true
	rw: true
}

mount {
	src: "/dev/urandom"
	dst: "/dev/urandom"
	is_bind: true
}

mount {
	src: "/dev/random"
	dst: "/dev/random"
	is_bind: true
}

{TMP_MOUNT_BLOCK}

# HOME keeps the worker's path, so the package manager finds the operator's
# ~/.npmrc / ~/.bunfig.toml, but is otherwise a private tmpfs.
{HOME_MOUNT_BLOCK}

# package.json/lockfile/.npmrc/bunfig.toml live here and node_modules is
# written here; cwd of the install
mount {
    src: "{JOB_DIR}"
    dst: "{JOB_DIR}"
    is_bind: true
    rw: true
}

# shared bun install cache. Writable, like the other install jails' shared
# caches.
mount {
    src: "{BUN_CACHE_DIR}"
    dst: "{BUN_CACHE_DIR}"
    is_bind: true
    rw: true
}

mount {
    src: "{TRACING_PROXY_CA_CERT_PATH}"
    dst: "{TRACING_PROXY_CA_CERT_PATH}"
    is_bind: true
    mandatory: false
}

{CA_MOUNT}

#{DEV}
