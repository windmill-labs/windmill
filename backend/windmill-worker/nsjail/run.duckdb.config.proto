name: "duckdb run"

mode: ONCE
hostname: "duckdb"
log_level: ERROR
# The executor's own job timeout kills the jail; nsjail adds none of its own.
time_limit: 0

# DuckDB bounds its memory through memory_limit, and the worker bounds its disk use (see the
# work dir mount). rlimit_as would break it: jemalloc reserves address space well past what it
# ever touches.
disable_rl: true

cwd: "/tmp"

clone_newnet: false
clone_newuser: {CLONE_NEWUSER}

skip_setsid: true
keep_caps: false
keep_env: true
mount_proc: true

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
}

mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
}

mount {
    src: "/proc/self/fd"
    dst: "/dev/fd"
    is_symlink: true
    mandatory: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}

mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
}

# DuckDB sizes its thread pool from the cgroup's CPU quota.
mount {
    src: "/sys/fs/cgroup"
    dst: "/sys/fs/cgroup"
    is_bind: true
    mandatory: false
}

mount {
    src: "/etc"
    dst: "/etc"
    is_bind: true
}

# Container runtimes bind exactly these 3 files as separate submounts over
# /etc; nsjail's ro remount of /etc is non-recursive so they stay writable.
# Load-bearing -- do not remove as redundant with the /etc bind above.
mount {
    src: "/etc/resolv.conf"
    dst: "/etc/resolv.conf"
    is_bind: true
    mandatory: false
}

mount {
    src: "/etc/hosts"
    dst: "/etc/hosts"
    is_bind: true
    mandatory: false
}

mount {
    src: "/etc/hostname"
    dst: "/etc/hostname"
    is_bind: true
    mandatory: false
}

{TMP_MOUNT_BLOCK}

# At its host path, so every path the worker wrote into the blocks (Postgres root
# certificates) resolves unchanged. Read-only: the one writable place on the host is the
# runner's work dir below, which the worker caps at DUCKDB_MAX_TEMP_DIRECTORY_SIZE.
mount {
    src: "{JOB_DIR}"
    dst: "{JOB_DIR}"
    is_bind: true
}

# The spill directory and the result file.
mount {
    src: "{JOB_DIR}/duckdb"
    dst: "{JOB_DIR}/duckdb"
    is_bind: true
    rw: true
}

mount {
    src: "{RUNNER_PATH}"
    dst: "/tmp/windmill_duckdb_runner"
    is_bind: true
}

# Read-only: the worker installs into it before the jail starts, so a job can load what it
# named but can neither add to nor replace what the next job loads.
mount {
    src: "{EXTENSION_DIR}"
    dst: "/tmp/.duckdb/extensions"
    is_bind: true
    mandatory: false
}

{BIGQUERY_CREDENTIALS_MOUNT}

envar: "HOME=/tmp"

#{DEV}
