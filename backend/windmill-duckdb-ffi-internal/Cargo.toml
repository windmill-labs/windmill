[package]
name = "windmill_duckdb_ffi_internal"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
# `rust_decimal` is optional upstream. It stays on because its
# `From<rust_decimal::Decimal>` derives the same width/scale/mantissa the crate
# used to derive itself, so a `decimal`/`numeric` job argument still binds to the
# identical DECIMAL. Building one by hand would mean reimplementing that
# f64 → (mantissa, scale) inference.
#
# Pinned exactly, so `cargo update` cannot move the engine (and the prebuilt extensions it
# must match) under us. DuckDB 2.0.0 (duckdb-rs 1.20000.0) is not on crates.io yet: this is
# duckdb/duckdb-rs#913's head, which vendors the v2.0.0 tag. Move back to the crates.io release
# once it is published.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", rev = "c4532aa5b054a2e8898870c75e7bd3425491b07d", features = [
    "bundled",
    "rust_decimal",
] }
regex = "1"
rust_decimal = "1.37.2"
serde = { version = "1.0", features = ["derive"] }
# 1.0.151 introduced RawValue::from_string_unchecked, which row collection uses
# to avoid re-parsing every row.
serde_json = { version = "^1.0.151", features = ["preserve_order", "raw_value"] }

[[bin]]
name = "windmill_duckdb_runner"
path = "src/bin/windmill_duckdb_runner.rs"
