[package]
name = "windmill_duckdb_ffi_internal"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
# `rust_decimal` is optional upstream. It stays on because its
# `From<rust_decimal::Decimal>` derives the same width/scale/mantissa the crate
# used to derive itself, so a `decimal`/`numeric` job argument still binds to the
# identical DECIMAL. Building one by hand would mean reimplementing that
# f64 → (mantissa, scale) inference.
#
# Not crates.io: windmill-labs/duckdb-rs is duckdb-rs 1.10505.0 (DuckDB 1.5.5) plus one
# patch to the bundled engine, adding the `lock_temp_directory` setting the isolation
# transform needs to keep out-of-core execution working behind
# `disabled_filesystems='LocalFileSystem'`. The patch is written in the shape duckdb/duckdb
# takes changes but has not been filed there; if it ever lands in a released DuckDB this
# goes back to the crates.io crate. Pinned by rev rather than branch so `cargo update`
# cannot move the engine. See
# https://github.com/windmill-labs/duckdb-rs/blob/windmill/duckdb-1.5.5/crates/libduckdb-sys/windmill/README.md
duckdb = { git = "https://github.com/windmill-labs/duckdb-rs", rev = "4dd55f271a451e3df7caa7f244c966626b5b5f52", features = [
    "bundled",
    "rust_decimal",
] }
regex = "1"
rust_decimal = "1.37.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "^1", features = ["preserve_order", "raw_value"] }

[lib]
crate-type = ["cdylib"]
