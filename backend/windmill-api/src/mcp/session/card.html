<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windmill</title>
<!--
  The MCP Apps view the session's show tools draw (`CARD_URI` in `mod.rs`, `views.rs`): a
  run, a table of runs, drafts to review before deploying, or a workspace item, from
  whichever of `_meta["windmill/run" | "windmill/runs" | "windmill/review" | "windmill/item"]`
  the result carries. It holds no credential: it acts by calling tools
  through the host, as the user the connection belongs to. Everything it shows is set as
  text, never as markup: a run's result is whatever its script returned.
-->
<style>
  /* Colours, fonts and radii come from the host's style variables when it sends them, so the
     card reads as part of the host; the fallbacks are Windmill's palette, with its body and
     emphasis text apart. The accent stays Windmill's: hosts allow a brand accent on the
     primary action only. Spacing follows Windmill's 4px scale. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #efeff4);
    --fg: var(--color-text-primary, #3d4758);
    --fg-em: var(--color-text-primary, #1d2430);
    --fg-2: var(--color-text-secondary, #718096);
    --fg-3: var(--color-text-tertiary, #8d93a1);
    --line: var(--color-border-tertiary, #e5e7eb);
    --info-bg: var(--color-background-info, #e9ecfe);
    --info-fg: var(--color-text-info, #183faf);
    --ok-bg: var(--color-background-success, #dcfce7);
    --ok-fg: var(--color-text-success, #3b7a5b);
    --bad-bg: var(--color-background-danger, #fee2e2);
    --bad-fg: var(--color-text-danger, #693237);
    --accent: #758ff8;
    --accent-hover: #5074f6;
    --radius: var(--border-radius-md, 6px);
    --sans: var(--font-sans, Inter, system-ui, -apple-system, sans-serif);
    --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #2e3441);
      --bg-2: var(--color-background-secondary, #272c35);
      --fg: var(--color-text-primary, #d4d7dd);
      --fg-em: var(--color-text-primary, #eeeff2);
      --fg-2: var(--color-text-secondary, #a9b0ba);
      --fg-3: var(--color-text-tertiary, #8d93a1);
      --line: var(--color-border-tertiary, #374457);
      --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
      --info-fg: var(--color-text-info, #c7cefc);
      --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
      --ok-fg: var(--color-text-success, #dcfce7);
      --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
      --bad-fg: var(--color-text-danger, #fee2e2);
      --accent: #7085db;
      --accent-hover: #5670d5;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #2e3441);
    --bg-2: var(--color-background-secondary, #272c35);
    --fg: var(--color-text-primary, #d4d7dd);
    --fg-em: var(--color-text-primary, #eeeff2);
    --fg-2: var(--color-text-secondary, #a9b0ba);
    --fg-3: var(--color-text-tertiary, #8d93a1);
    --line: var(--color-border-tertiary, #374457);
    --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
    --info-fg: var(--color-text-info, #c7cefc);
    --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
    --ok-fg: var(--color-text-success, #dcfce7);
    --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
    --bad-fg: var(--color-text-danger, #fee2e2);
    --accent: #7085db;
    --accent-hover: #5670d5;
  }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.4 var(--sans); color: var(--fg); }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .head { display: flex; align-items: flex-start; gap: 12px; }
  .title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .subtitle { font: 12px var(--mono); color: var(--fg-2); overflow-wrap: anywhere; }
  .path.named { font: 600 14px/1.3 var(--sans); }
  .kind-icon { flex: none; width: 28px; height: 28px; border-radius: var(--radius); background: var(--bg-2); color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; }
  .kind-icon .lucide { width: 16px; height: 16px; color: inherit; }
  /* Blocks sit 12px apart; a section keeps its header 8px above what it opens. */
  #body, #details { display: flex; flex-direction: column; gap: 12px; }
  .section { display: flex; flex-direction: column; gap: 8px; }
  /* Tabs, in fullscreen alone: inline a card is one view (OpenAI's guidelines rule out tabs
     there). Drawn as Windmill's own: an underlined strip, the selected tab marked by a bar
     and an emphasised label. */
  .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); }
  .tab { min-height: 0; padding: 4px 0; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; font-size: 12px; font-weight: 400; color: var(--fg); }
  .tab[aria-selected="true"] { border-bottom-color: var(--fg-3); color: var(--fg-em); font-weight: 600; }
  .tab:hover:not([aria-selected="true"]) { background: none; border-bottom-color: var(--line); }
  .row.open-step { cursor: pointer; }
  .row.open-step:hover { background: var(--bg-2); }
  .chev { display: inline-flex; color: var(--fg-3); }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; min-height: 0; font-size: 13px; color: var(--fg-2); }
  .back:hover { background: none; color: var(--fg-em); }
  .more-line { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; min-height: 0; font-size: 13px; color: var(--fg-2); }
  .more-line:hover { background: none; color: var(--fg-em); text-decoration: underline; }
  .empty { font-size: 13px; color: var(--fg-3); }
  /* An empty slot takes no gap in the card's rhythm. */
  #result-more:empty, #result-table:empty, #body:empty, #result-slot:not(:has(:not([hidden]))), .actions:not(:has(> :not([hidden]))) { display: none; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--fg-em); }
  .path { font: 600 14px/1.3 var(--mono); color: var(--fg-em); overflow-wrap: anywhere; text-align: left; }
  button.path { border: 0; padding: 0; min-height: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  button.path:hover { background: none; text-decoration: underline; }
  button.path:disabled { opacity: 1; cursor: default; text-decoration: none; }
  /* Lucide's line icons, as Windmill uses, in the host's text colour. */
  .lucide { width: 14px; height: 14px; flex: none; vertical-align: -2px; color: var(--fg-3); }
  button .lucide { color: inherit; }
  .icon { flex: none; min-height: 28px; width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .disclosure { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; padding: 0; min-height: 0; background: none; font-size: 13px; font-weight: 600; color: var(--fg-em); }
  .disclosure:hover { background: none; text-decoration: underline; }
  .summary-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 12px; font-size: 13px; }
  .summary-row + .summary-row { border-top: 1px solid var(--line); }
  button.summary-row { width: 100%; min-height: 0; border: 0; border-radius: 0; background: transparent; font: inherit; color: inherit; text-align: left; }
  button.summary-row:hover { background: var(--bg-2); }
  .summary-row .grow { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--fg-em); overflow-wrap: anywhere; }
  .summary-row .why { flex-basis: 100%; font-size: 12px; color: var(--fg-2); }
  .add-count { color: var(--ok-fg); font: 12px var(--mono); }
  .del-count { color: var(--bad-fg); font: 12px var(--mono); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); }
  .ws { background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg-2); font-weight: 500; }
  .pill, .badge { flex: none; font-size: 12px; font-weight: 400; padding: 2px 8px; border-radius: 6px; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
  .success, .pill.success { background: var(--ok-bg); color: var(--ok-fg); }
  .failure, .canceled, .not_started, .pill.failure, .pill.canceled, .pill.not_started, .pill.error { background: var(--bad-bg); color: var(--bad-fg); }
  .step { font-size: 13px; color: var(--fg-2); }
  .progress-block { display: flex; flex-direction: column; gap: 4px; }
  .progress { display: flex; gap: 4px; }
  .segment { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .segment.success { background: var(--ok-fg); }
  .segment.failure { background: var(--bad-fg); }
  .segment.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .segment.running { animation: none; } }
  .live-log { font: 12px var(--mono); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step code { font-family: var(--mono); }
  pre { margin: 0; padding: 8px 12px; border-radius: var(--radius); background: var(--bg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.clip { max-height: 180px; overflow: hidden; }
  /* Error colour goes on text, as in Windmill: `name: message` in it, the stack plain. */
  pre.error { color: var(--bad-fg); }
  .error-line { color: var(--bad-fg); font-weight: 600; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 12px; font-size: 13px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.nested { padding-left: 28px; }
  .row .v { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; color: var(--fg-em); }
  .row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .dim { color: var(--fg-3); font-size: 12px; }
  .row .k { color: var(--fg-3); min-width: 110px; }
  .row pre { flex-basis: 100%; padding: 4px 8px; }
  .row .step-link { min-height: 20px; width: 20px; border: 0; background: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--info-fg); }
  .dot.success { background: var(--ok-fg); }
  .dot.failure, .dot.canceled { background: var(--bad-fg); }
  .dot.skipped { background: var(--fg-3); }
  .openable { position: relative; }
  .openable .corner { position: absolute; top: 4px; right: 4px; min-height: 24px; width: 24px; background: var(--bg); }
  pre.cut { cursor: pointer; -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent); mask-image: linear-gradient(to bottom, #000 75%, transparent); }
  pre.cut.from-end { -webkit-mask-image: linear-gradient(to top, #000 75%, transparent); mask-image: linear-gradient(to top, #000 75%, transparent); }
  .patch { font: 12px/1.45 var(--mono); padding: 6px 0; background: var(--bg-2); border-radius: var(--radius); overflow-wrap: anywhere; }
  .patch div { padding: 0 12px; white-space: pre-wrap; }
  .patch .add { background: var(--ok-bg); color: var(--ok-fg); }
  .patch .del { background: var(--bad-bg); color: var(--bad-fg); }
  .patch .hunk { color: var(--info-fg); }
  .patch .file { font-weight: 600; color: var(--fg); padding-top: 8px; }
  .patch .note { color: var(--fg-2); font-family: var(--sans); }
  /* As Windmill's tables: a light border, the header row on the secondary surface. */
  .table { border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  thead tr { background: var(--bg-2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 12px; font-weight: 400; color: var(--fg); padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  td.mono { font: 12px var(--mono); }
  tr.link { cursor: pointer; }
  tr.link:hover td { background: var(--bg-2); }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .item + .item { border-top: 1px solid var(--line); padding-top: 12px; }
  .item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .item-head .grow { flex: 1; min-width: 0; font: 600 13px var(--mono); color: var(--fg-em); overflow-wrap: anywhere; }
  button.small { min-height: 28px; padding: 0 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .form-error { color: var(--bad-fg); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 500 13px var(--sans); min-height: 32px; padding: 0 12px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  button:hover:not(:disabled) { background: var(--bg-2); }
  button.primary { background: var(--accent); color: #ffffff; border-color: transparent; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="head">
    <span class="kind-icon" id="kind-icon" hidden></span>
    <div class="title">
      <button class="path" id="path" type="button" disabled>Windmill</button>
      <div class="subtitle" id="summary" hidden></div>
      <div class="meta">
        <span class="ws" id="ws" hidden></span>
        <span id="kind"></span>
        <span id="duration"></span>
      </div>
    </div>
    <span class="pill" id="status" hidden></span>
    <button class="icon" id="expand" type="button" title="Full screen" aria-label="Full screen" hidden></button>
  </div>
  <div class="progress-block" id="step" hidden></div>
  <div class="step" id="stale" hidden>No longer refreshing here. Open it in Windmill for its live status.</div>
  <div class="error-line" id="error-line" hidden></div>
  <div id="result-slot"><pre class="clip" id="result" hidden></pre></div>
  <div id="result-more"></div>
  <div id="result-table"></div>
  <div id="body"></div>
  <section id="details" hidden></section>
  <div class="actions">
    <button id="cancel" type="button" hidden>Cancel run</button>
    <button class="primary" id="review" type="button" hidden>Review and deploy</button>
  </div>
</main>
<script>
(() => {
  // Every poll is a tool call the server serves with a freshly minted token, which lands in
  // the API's shared auth cache: polls back off and stop after ten minutes (~50 per card).
  const MAX_POLL_MS = 10 * 60 * 1000;
  const pollDelay = (age) => (age < 10_000 ? 2_000 : age < 60_000 ? 5_000 : 15_000);
  const RUNNING = ['running', 'queued', 'suspended'];
  const LABELS = {
    running: 'Running', queued: 'Queued', suspended: 'Waiting', success: 'Success',
    failure: 'Failed', canceled: 'Canceled', skipped: 'Skipped', not_started: 'Not started',
    step: 'Step result', in_progress: 'Running', error: 'Error'
  };
  const $ = (id) => document.getElementById(id);

  let nextId = 1;
  const pending = new Map();
  let host = {};
  let toolArgs = {};
  let view = null;
  let run = null;
  let pollStarted = 0;
  let pollTimer = null;
  let tickTimer = null;

  function post(message) {
    window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  }
  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function callTool(name, args) {
    return request('tools/call', { name, arguments: args });
  }
  function textOf(result) {
    return (result?.content ?? []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  }
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    node.append(...children.filter((c) => c != null && c !== false));
    return node;
  }
  // Lucide icons (as Windmill uses), built from constant shapes: no markup is parsed.
  const ICONS = {
    external: [['path', { d: 'M15 3h6v6' }], ['path', { d: 'M10 14 21 3' }], ['path', { d: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6' }]],
    maximize: [['polyline', { points: '15 3 21 3 21 9' }], ['polyline', { points: '9 21 3 21 3 15' }], ['line', { x1: '21', x2: '14', y1: '3', y2: '10' }], ['line', { x1: '3', x2: '10', y1: '21', y2: '14' }]],
    right: [['path', { d: 'm9 18 6-6-6-6' }]],
    down: [['path', { d: 'm6 9 6 6 6-6' }]],
    back: [['path', { d: 'm15 18-6-6 6-6' }]],
    // The kinds, as Windmill draws them (its flow icon is three staggered bars).
    script: [['path', { d: 'm18 16 4-4-4-4' }], ['path', { d: 'm6 8-4 4 4 4' }], ['path', { d: 'm14.5 4-5 16' }]],
    flow: [['path', { d: 'M3 6h13' }], ['path', { d: 'M8 12h13' }], ['path', { d: 'M3 18h13' }]],
    schedule: [['path', { d: 'M8 2v4' }], ['path', { d: 'M16 2v4' }], ['rect', { width: '18', height: '18', x: '3', y: '4', rx: '2' }], ['path', { d: 'M3 10h18' }]],
    trigger: [['path', { d: 'M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z' }]],
    http: [['circle', { cx: '6', cy: '19', r: '3' }], ['path', { d: 'M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15' }], ['circle', { cx: '18', cy: '5', r: '3' }]],
    resource: [['path', { d: 'M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z' }], ['path', { d: 'm3.3 7 8.7 5 8.7-5' }], ['path', { d: 'M12 22V12' }]],
    app: [['rect', { width: '7', height: '9', x: '3', y: '3', rx: '1' }], ['rect', { width: '7', height: '5', x: '14', y: '3', rx: '1' }], ['rect', { width: '7', height: '9', x: '14', y: '12', rx: '1' }], ['rect', { width: '7', height: '5', x: '3', y: '16', rx: '1' }]],
    review: [['circle', { cx: '5', cy: '6', r: '3' }], ['path', { d: 'M12 6h5a2 2 0 0 1 2 2v7' }], ['path', { d: 'm15 9-3-3 3-3' }], ['circle', { cx: '19', cy: '18', r: '3' }], ['path', { d: 'M12 18H7a2 2 0 0 1-2-2V9' }], ['path', { d: 'm9 15 3 3-3 3' }]],
    runs: [['path', { d: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8' }], ['path', { d: 'M3 3v5h5' }], ['path', { d: 'M12 7v5l4 2' }]]
  };
  function icon(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    const attrs = { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'lucide', 'aria-hidden': 'true' };
    for (const [k, v] of Object.entries(attrs)) svg.setAttribute(k, v);
    for (const [tag, shape] of ICONS[name]) {
      const node = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(shape)) node.setAttribute(k, v);
      svg.append(node);
    }
    return svg;
  }
  // A button that opens a Windmill page.
  const linkButton = (label, url, style) => el('button', { class: 'small', type: 'button', style, onclick: () => openLink(url) }, label, icon('external'));

  const KINDS = { preview: 'script test', flowpreview: 'flow test', flowscript: 'flow step', flowdependencies: 'flow dependencies' };
  const kindLabel = (kind) => (kind ? KINDS[kind] ?? kind : '');

  function formatMs(ms) {
    if (ms == null || ms < 0) return '';
    if (ms < 1000) return `${Math.round(ms)}ms`;
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  }

  function canFullscreen() {
    return (host.availableDisplayModes ?? []).includes('fullscreen');
  }
  const fullscreen = () => host.displayMode === 'fullscreen';

  // A text block cut to fit inline opens whole on a click anywhere on it, or on its corner
  // button: fullscreen, or the page in Windmill on a host without it. Shown whole, it is
  // plain text to select.
  function openable(block, cut, url, tabName = null) {
    const open = canFullscreen() ? () => (tabName ? openTab(tabName) : setDisplayMode('fullscreen')) : url ? () => openLink(url) : null;
    if (!cut || !open) return block;
    block.classList.add('cut');
    block.title = canFullscreen() ? 'Show it all' : 'Open in Windmill';
    block.addEventListener('click', open);
    const corner = el('button', { class: 'icon corner', type: 'button', 'aria-label': block.title, title: block.title, onclick: open },
      icon(canFullscreen() ? 'maximize' : 'external'));
    return el('div', { class: 'openable' }, block, corner);
  }

  // What does not fit inline opens fullscreen, or on a host without it the page in
  // Windmill: grown inline it would pass the height hosts cap a card at.
  function moreButton(label, url) {
    if (canFullscreen()) {
      return el('button', { class: 'small', type: 'button', style: 'margin-top: 8px', onclick: () => setDisplayMode('fullscreen') }, `Show ${label}`, icon('maximize'));
    }
    if (!url) return null;
    return linkButton(`${label[0].toUpperCase()}${label.slice(1)} in Windmill`, url, 'margin-top: 8px');
  }
  // A section the user opened stays open across redraws. Fullscreen opens them all, and
  // what is closed there is kept apart from what is open inline.
  const opened = new Set();
  const closedFull = new Set();

  function disclosure(key, label, content) {
    const full = fullscreen();
    const open = full ? !closedFull.has(key) : opened.has(key);
    const toggle = el('button', {
      class: 'disclosure', type: 'button', 'aria-expanded': String(open),
      onclick: () => {
        const set = full ? closedFull : opened;
        if (set.has(key)) set.delete(key); else set.add(key);
        redraw();
      }
    }, icon(open ? 'down' : 'right'), label);
    return [el('div', { class: 'section' }, toggle, open ? content() : null)];
  }

  function setDisplayMode(mode) {
    if (mode === 'fullscreen' && !canFullscreen()) return;
    if (mode === (host.displayMode ?? 'inline')) return;
    request('ui/request-display-mode', { mode }).then((result) => {
      if (result?.mode) host.displayMode = result.mode;
      redraw();
    }).catch(() => {});
  }

  // The header names what the card shows and links to it in Windmill: opening a page is
  // neither a tool call nor a conversation turn, so it is no card action. A summary names
  // it when there is one, with the path under it.
  function setHeader({ path, ws, kind = '', status = null, label = null, url = null, summary = null, kindIcon = null }) {
    const named = !!summary;
    $('path').classList.toggle('named', named);
    $('summary').hidden = !named || !path;
    $('summary').textContent = named ? path ?? '' : '';
    $('path').replaceChildren(named ? summary : path || 'Windmill', ...(url ? [icon('external')] : []));
    $('kind-icon').hidden = !kindIcon;
    $('kind-icon').replaceChildren(...(kindIcon ? [icon(kindIcon)] : []));
    $('path').disabled = !url;
    $('path').dataset.url = url ?? '';
    $('path').title = url ? 'Open in Windmill' : '';
    $('ws').hidden = !ws;
    $('ws').textContent = ws || '';
    $('kind').textContent = kind;
    const pill = $('status');
    pill.hidden = !label;
    pill.className = `pill ${status ?? ''}`;
    pill.textContent = label ?? '';
  }
  // ---------------------------------------------------------------- tables

  function cellText(value) {
    if (value == null) return '';
    if (value instanceof Node || typeof value === 'string') return value;
    const json = JSON.stringify(value);
    return json.length > 200 ? `${json.slice(0, 200)}…` : json;
  }

  // Columns are `{ label, value(row), show?(value), mono? }`; clicking a header sorts by it.
  // Inline it shows `ROWS_INLINE` rows, and `more` (the noun, the page in Windmill) the rest.
  function table(columns, rows, onRow, more) {
    const limit = fullscreen() ? Infinity : ROWS_INLINE;
    let sort = null;
    const key = (value) => (typeof value === 'number' ? value : String(cellText(value) ?? ''));
    const body = el('tbody');
    const draw = () => {
      const sorted = !sort ? rows : [...rows].sort((a, b) => {
        const [x, y] = [key(sort.column.value(a)), key(sort.column.value(b))];
        return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
      });
      body.replaceChildren(...sorted.slice(0, limit).map((row) => el('tr', { class: onRow ? 'link' : null, onclick: onRow && (() => onRow(row)) },
        ...columns.map((column) => {
          const value = column.value(row);
          return el('td', { class: column.mono ? 'mono' : null }, cellText(column.show ? column.show(value) : value));
        }))));
    };
    const head = el('tr', {}, ...columns.map((column) => el('th', {
      onclick: () => {
        sort = { column, dir: sort?.column === column ? -sort.dir : 1 };
        draw();
      }
    }, column.label)));
    draw();
    const hidden = rows.length - Math.min(rows.length, limit);
    return el('div', {},
      el('div', { class: 'table' }, el('table', {}, el('thead', {}, head), body)),
      hidden > 0 ? moreButton(`${hidden} more ${more.noun}${hidden === 1 ? '' : 's'}`, more.url) : null);
  }

  // A result Windmill draws as a table reads as one here too: a list of records, a list of
  // rows under a header row, or columns (each bare or under its `table-*` key). A result
  // cut short is no longer JSON, and stays text.
  function recordsTable(text) {
    let value;
    try { value = JSON.parse(text); } catch { return null; }
    let kind = null;
    if (value && typeof value === 'object' && !Array.isArray(value)) {
      const keys = Object.keys(value);
      if (keys.length === 1 && ['table-row', 'table-row-object', 'table-col'].includes(keys[0])) {
        kind = keys[0];
        value = value[kind];
      }
    }
    let rows = value;
    if (kind === 'table-col' && value && typeof value === 'object') {
      const columns = Object.keys(value).filter((c) => Array.isArray(value[c]));
      const length = Math.max(0, ...columns.map((c) => value[c].length));
      rows = Array.from({ length }, (_, i) => Object.fromEntries(columns.map((c) => [c, value[c][i]])));
    } else if (Array.isArray(value) && value.length > 1 && value.every(Array.isArray)) {
      const [header, ...body] = value;
      rows = body.map((cells) => Object.fromEntries(header.map((h, i) => [String(h), cells[i]])));
    }
    if (!Array.isArray(rows) || !rows.length || rows.length > 100) return null;
    if (!rows.every((row) => row && typeof row === 'object' && !Array.isArray(row))) return null;
    const keys = [...new Set(rows.flatMap(Object.keys))].slice(0, 8);
    return table(keys.map((k) => ({ label: k, value: (row) => row[k] })), rows, null, { noun: 'row', url: run.url });
  }

  // ---------------------------------------------------------------- run

  function elapsed() {
    if (!run) return '';
    if (run.duration_ms != null) return formatMs(run.duration_ms);
    if (run.started_at && RUNNING.includes(run.status)) {
      return formatMs(Date.now() - Date.parse(run.started_at));
    }
    return '';
  }

  // A running flow's place: a segment per top-level step, the current one named with its
  // loop or branch progress, and the latest log line of what runs now.
  function progressView() {
    const parts = [];
    if (run.steps) {
      // Only the steps that started have a status: the rest are still to come.
      // The count is the flow's modules: its preprocessor and error handler are not among them.
      const done = (run.step_list ?? []).filter((s) => s.step !== 'failure' && s.step !== 'preprocessor');
      const segment = (i) => i === run.step - 1 ? 'running'
        : i < run.step - 1 ? (done[i]?.status === 'failure' ? 'failure' : 'success') : '';
      parts.push(el('div', {
        class: 'progress', role: 'progressbar', 'aria-label': 'Steps done',
        'aria-valuemin': '0', 'aria-valuemax': String(run.steps), 'aria-valuenow': String(run.step - 1)
      }, ...Array.from({ length: run.steps }, (_, i) => el('span', { class: `segment ${segment(i)}` }))));
      const label = el('div', { class: 'step' }, `Step ${run.step} of ${run.steps}`);
      if (run.step_id) label.append(' · ', el('code', {}, run.step_id));
      if (run.step_progress) label.append(`, ${run.step_progress}`);
      parts.push(label);
    }
    if (run.live_log) parts.push(el('div', { class: 'live-log', title: run.live_log }, run.live_log));
    return parts;
  }

  function renderRun() {
    const status = run?.status ?? 'running';
    const running = RUNNING.includes(status);
    setHeader({
      path: run?.path ?? (run?.id ? `Run ${run.id.slice(0, 8)}` : toolArgs.path ?? 'Windmill'),
      ws: run?.workspace ?? toolArgs.workspace_id,
      kind: kindLabel(run?.job_kind),
      status,
      label: run ? (LABELS[status] ?? status) : 'Starting',
      url: run?.url,
      summary: run?.summary,
      kindIcon: run?.job_kind && /flow/.test(run.job_kind) ? 'flow' : run?.job_kind ? 'script' : null
    });
    $('duration').textContent = elapsed();
    if (!running) $('stale').hidden = true;
    const step = $('step');
    step.hidden = !(running && (run?.steps || run?.live_log));
    step.replaceChildren(...(step.hidden ? [] : progressView()));
    const result = $('result');
    const failed = ['failure', 'not_started', 'error'].includes(status);
    // Fullscreen, the tabs carry the result; inline it shows here.
    const inline = !(fullscreen() && run?.id);
    const errorLine = $('error-line');
    errorLine.hidden = !inline || !failed || run?.result == null;
    errorLine.textContent = failed ? run?.result ?? '' : '';
    const described = run?.result_kind === 'file';
    const records = inline && status === 'success' && !described ? recordsTable(run?.result) : null;
    const shown = failed ? run?.stack : run?.result;
    result.hidden = !inline || running || shown == null || !!records || described;
    result.textContent = shown ?? '';
    result.classList.toggle('clip', !fullscreen());
    // Rebuilt only for a new result, so a sort survives the card redrawing.
    const holder = $('result-table');
    const source = records ? `${fullscreen()}:${run.result}` : '';
    if (holder.dataset.source !== source) {
      holder.dataset.source = source;
      holder.replaceChildren(...(records ? [records] : []));
    }
    // A long result is clipped inline; the server also cuts one past its own limit.
    const more = $('result-more');
    more.replaceChildren();
    // A file, image, page or map is named here and shown on the run page.
    if (inline && described && !running) more.append(el('div', { class: 'step' }, run.result), linkButton('View it in Windmill', run.url, 'margin-top: 8px'));
    // A flow waiting on an approval or another event is resumed or canceled on its page.
    if (inline && status === 'suspended') more.append(el('div', { class: 'step' }, 'Waiting for an approval or another event.'), linkButton('Approve or cancel in Windmill', run.url, 'margin-top: 8px'));
    // The result is clipped inline; a click on it opens it whole.
    const slot = $('result-slot');
    result.classList.remove('cut');
    const fresh = el('pre', { class: result.className, id: 'result', hidden: result.hidden }, result.textContent);
    slot.replaceChildren(fresh);
    if (!fresh.hidden) {
      const clipped = !fullscreen() && fresh.scrollHeight > fresh.clientHeight + 1;
      slot.replaceChildren(openable(fresh, clipped, run.url, 'result'));
      // What the server cut is only whole on the run page, however much of it shows here.
      if (run.result_cut && !(clipped && canFullscreen())) more.append(linkButton('Full result in Windmill', run.url));
    }

    $('cancel').hidden = !(running && run?.id && run.can_cancel);
    $('review').hidden = true;
    $('expand').hidden = !canFullscreen() || fullscreen() || !run?.id;
    renderDetails();
    window.clearInterval(tickTimer);
    if (running && run?.started_at) tickTimer = window.setInterval(() => {
      $('duration').textContent = elapsed();
    }, 1000);
  }

  // A step's own run page, which has its arguments, logs and whole result.
  const stepUrl = (jobId) => (jobId && run?.url && run?.id ? run.url.replace(run.id, jobId) : null);
  const isFlow = () => /flow/.test(run?.job_kind ?? '');

  // A step's status as the server groups it: a failed iteration or branch fails the step
  // only when it stopped the run, which makes it the last step that ran (one set to skip
  // failures carries on).
  function groupStatus(step, last) {
    if (step.status) return step.status;
    const parts = step.branches ?? step.iterations_shown ?? [];
    const failed = step.failed_iterations || parts.some((p) => ['failure', 'canceled'].includes(p.status));
    if (step.unfinished || parts.some((p) => RUNNING.includes(p.status))) return 'running';
    return failed && last && ['failure', 'canceled'].includes(run.status) ? 'failure' : 'success';
  }

  // The flow's own steps: its preprocessor and error handler are not among the modules.
  const flowSteps = () => (run?.step_list ?? []).filter((s) => s.step !== 'failure' && s.step !== 'preprocessor');

  // Inline, a flow's steps are one line; the Steps tab has them.
  function stepsLine() {
    const steps = flowSteps();
    if (!steps.length || RUNNING.includes(run.status)) return null;
    const lastRan = steps.length - 1;
    const failedAt = steps.find((s, i) => groupStatus(s, i === lastRan) === 'failure');
    const groups = steps.filter((s) => s.branches || s.iterations != null)
      .map((s) => s.branches ? `${s.step} ran ${plural(s.branches.length, 'branch')}` : `${s.step} ran ${plural(s.iterations, 'iteration')}`);
    const text = [plural(steps.length, 'step'), failedAt ? `failed at ${failedAt.step}` : 'all succeeded', ...groups].join(' \u00b7 ');
    if (canFullscreen()) return el('button', { class: 'more-line', type: 'button', onclick: () => openTab('steps') }, text, icon('maximize'));
    return el('div', { class: 'step' }, text);
  }

  // A row of the Steps tab: compact, no result; a click opens the step itself.
  function stepRow({ id, label, status, note, duration, job, nested, toggle, open }) {
    const drill = job && !toggle ? () => openStep({ id, job }) : null;
    return el('div', { class: `row${nested ? ' nested' : ''}${drill || toggle ? ' open-step' : ''}`, onclick: toggle ?? drill },
      toggle ? el('span', { class: 'chev' }, icon(open ? 'down' : 'right')) : null,
      el('span', { class: `dot ${status ?? ''}` }),
      el('span', { class: 'v' }, id),
      el('span', { class: 'grow' }, label ?? ''),
      el('span', { class: 'dim' }, [note, LABELS[status] ?? status ?? '', formatMs(duration)].filter(Boolean).join(' \u00b7 ')));
  }

  // A loop or parallel step is one row that opens onto its iterations or branches.
  const openGroups = new Set();
  function stepRows(step, last) {
    const status = groupStatus(step, last);
    const parts = step.branches ?? (step.iterations != null ? step.iterations_shown ?? [] : null);
    if (!parts) {
      return [stepRow({
        id: step.step, status, duration: step.duration_ms, job: step.job_id,
        label: step.label?.startsWith(`Step ${step.step}`) ? '' : step.label,
        note: step.attempts > 1 ? `${step.attempts} attempts` : ''
      })];
    }
    const open = openGroups.has(step.step);
    const note = step.branches ? plural(step.branches.length, 'branch')
      : [plural(step.iterations, 'iteration'), `${step.ok} ok`, step.failed_iterations && `failed: ${step.failed_iterations.join(', ')}`].filter(Boolean).join(' \u00b7 ');
    const toggle = () => { if (open) openGroups.delete(step.step); else openGroups.add(step.step); redraw(); };
    const rows = [stepRow({ id: step.step, status, note, toggle, open })];
    if (open) {
      rows.push(...parts.map((p, i) => stepRow({
        id: step.branches ? `branch ${i + 1}` : `iteration ${p.iteration}`,
        status: p.status, duration: p.duration_ms, job: p.job_id, nested: true
      })));
      if (step.iterations_elided) {
        rows.push(el('div', { class: 'row nested' }, el('span', { class: 'dim' }, `${plural(step.iterations_elided, 'other iteration')} on the run page`)));
      }
    }
    return rows;
  }

  // ---------------------------------------------------------------- fullscreen run view

  let tab = null;
  let stepView = null;

  function openTab(name) {
    tab = name;
    stepView = null;
    if (canFullscreen()) setDisplayMode('fullscreen');
    redraw();
  }

  // A step drilled into is read as a run of its own: each step is one, and `get_run` reads it.
  async function openStep({ id, job }) {
    const token = {};
    stepView = { id, job, run: null, tab: null, token };
    redraw();
    try {
      const result = await callTool('get_run', { workspace_id: run.workspace, id: job });
      if (stepView?.token !== token) return;
      stepView.run = result?._meta?.['windmill/run'] ?? { status: 'error', result: textOf(result) };
    } catch (e) {
      if (stepView?.token !== token) return;
      stepView.run = { status: 'error', result: e?.message ?? 'The step could not be read.' };
    }
    redraw();
  }

  function tabBar(names, active, select) {
    return el('div', { class: 'tabs', role: 'tablist' }, ...names.map(([name, label]) => el('button', {
      class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(name === active), onclick: () => select(name)
    }, label)));
  }

  // One run's Result, Logs or Inputs, whole: `of` is the run or a step drilled into.
  function runPane(of, name) {
    const failed = ['failure', 'not_started', 'error'].includes(of.status);
    const url = of.url ?? run.url;
    if (name === 'logs') {
      if (!of.logs) return el('div', { class: 'empty' }, RUNNING.includes(of.status) ? 'No logs yet.' : 'No logs.');
      const lines = of.logs.split('\n');
      // A log cut to its end starts mid-line, unless that line is all there is.
      if (of.logs_cut && lines.length > 1) lines.shift();
      return el('div', { class: 'section' },
        of.logs_cut ? linkButton('Earlier lines in Windmill', url) : null,
        el('pre', {}, lines.join('\n')));
    }
    if (name === 'inputs') {
      if (of.args_cut) return el('div', { class: 'section' }, el('div', { class: 'empty' }, 'Too large to show here.'), linkButton('Inputs in Windmill', url));
      const entries = Object.entries(of.args ?? {});
      if (!entries.length) return el('div', { class: 'empty' }, 'No inputs.');
      return el('div', { class: 'rows' }, ...entries.map(([k, v]) => row(k, display(v))));
    }
    // Result
    const parts = [];
    if (of.status === 'suspended') parts.push(el('div', { class: 'step' }, 'Waiting for an approval or another event.'), linkButton('Approve or cancel in Windmill', url));
    if (failed && of.result != null) parts.push(el('div', { class: 'error-line' }, of.result));
    if (failed && of.stack) parts.push(el('pre', {}, of.stack));
    if (!failed && of.result_kind === 'file') parts.push(el('div', { class: 'step' }, of.result), linkButton('View it in Windmill', url));
    else if (!failed && of.result != null) {
      const records = of.status === 'success' ? recordsTable(of.result) : null;
      parts.push(records ?? el('pre', {}, of.result));
      if (of.result_cut) parts.push(linkButton('Full result in Windmill', url));
    }
    if (!parts.length) parts.push(el('div', { class: 'empty' }, RUNNING.includes(of.status) ? 'No result yet.' : 'No result.'));
    return el('div', { class: 'section' }, ...parts);
  }

  function fullView() {
    if (stepView) {
      const s = stepView.run;
      const active = stepView.tab ?? 'result';
      return [
        el('button', { class: 'back', type: 'button', onclick: () => { stepView = null; redraw(); } }, icon('back'), `Back to ${run.summary ?? run.path ?? 'the run'}`),
        el('div', { class: 'item-head' },
          el('span', { class: 'grow' }, stepView.id),
          s ? el('span', { class: `badge ${s.status ?? ''}` }, LABELS[s.status] ?? s.status ?? '') : null,
          s?.duration_ms != null ? el('span', { class: 'dim' }, formatMs(s.duration_ms)) : null,
          stepUrl(stepView.job) ? linkButton('Open in Windmill', stepUrl(stepView.job)) : null),
        s ? tabBar([['result', 'Result'], ['logs', 'Logs'], ['inputs', 'Inputs']], active, (name) => { stepView.tab = name; redraw(); })
          : el('div', { class: 'empty' }, 'Loading\u2026'),
        s ? runPane(s, active) : null
      ];
    }
    const steps = flowSteps();
    const names = [['result', ['failure', 'error'].includes(run.status) ? 'Error' : 'Result'], ['logs', 'Logs'], ['inputs', 'Inputs']];
    if (steps.length) names.push(['steps', 'Steps']);
    const active = names.some(([n]) => n === tab) ? tab
      : RUNNING.includes(run.status) ? (steps.length ? 'steps' : 'logs') : 'result';
    const lastRan = steps.length - 1;
    const pane = active === 'steps'
      ? el('div', { class: 'rows' }, ...steps.flatMap((step, i) => stepRows(step, i === lastRan)))
      : runPane(run, active);
    return [tabBar(names, active, (name) => { tab = name; redraw(); }), pane];
  }

  function renderDetails() {
    const details = $('details');
    const children = fullscreen() && run?.id ? fullView() : [stepsLine()];
    if (run?.unreadable) children.push(el('div', { class: 'step' }, 'The details could not be read. Open the run in Windmill.'));
    details.replaceChildren(...children.filter(Boolean));
    details.hidden = !details.children.length;
  }

  // A tool result without a run, shown as the model got it: a call that started nothing,
  // or a `get_run` drilling into one step.
  function renderText(result) {
    const inspected = toolArgs.id && !result.isError;
    run = { status: inspected ? 'step' : result.isError ? 'error' : 'not_started', result: textOf(result).slice(0, 1500) };
    view = 'run';
    renderRun();
  }

  function onRun(next) {
    // A refresh reads the job alone: the summary `show_run` read stays.
    run = { ...next, summary: next.summary ?? run?.summary };
    view = 'run';
    renderRun();
    if (RUNNING.includes(run.status)) schedulePoll();
  }

  function schedulePoll() {
    window.clearTimeout(pollTimer);
    const age = Date.now() - pollStarted;
    if (age < MAX_POLL_MS) {
      pollTimer = window.setTimeout(poll, pollDelay(age));
    } else {
      $('stale').hidden = false;
    }
  }

  async function poll() {
    const id = run?.id;
    if (!id) return;
    try {
      const result = await callTool('get_run', { workspace_id: run.workspace, id });
      if (run?.id === id) onResult(result);
    } catch {
      if (run?.id === id) refreshFailed();
    }
  }

  // A finished run's details are read once, so a failed read is said rather than waited on.
  function refreshFailed() {
    if (RUNNING.includes(run.status)) return schedulePoll();
    run.unreadable = true;
    renderRun();
  }

  $('cancel').addEventListener('click', async () => {
    const button = $('cancel');
    button.disabled = true;
    try {
      await callTool('cancel_job', { workspace_id: run.workspace, id: run.id });
    } catch {}
    button.disabled = false;
    window.clearTimeout(pollTimer);
    poll();
  });
  // ---------------------------------------------------------------- runs and review

  // A list view shows none of a run's parts.
  function clearRun() {
    window.clearTimeout(pollTimer);
    window.clearInterval(tickTimer);
    run = null;
    for (const id of ['step', 'stale', 'error-line', 'result', 'details', 'cancel', 'expand']) $(id).hidden = true;
    $('result-more').replaceChildren();
    $('duration').textContent = '';
    $('result-table').replaceChildren();
  }

  function openLink(url) {
    if (url) request('ui/open-link', { url }).catch(() => {});
  }

  let runsMeta = null;

  function renderRuns(meta) {
    view = 'runs';
    runsMeta = meta;
    clearRun();
    setHeader({ summary: meta.runs.length === 1 ? '1 run' : `${meta.runs.length} runs`, ws: meta.workspace, url: meta.url, kindIcon: 'runs' });
    $('review').hidden = true;
    const time = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '');
    $('body').replaceChildren(table([
      { label: 'Status', value: (r) => r.status, show: (s) => el('span', { class: `badge ${s ?? ''}` }, LABELS[s] ?? s ?? '') },
      { label: 'Path', value: (r) => r.path ?? r.id, mono: true },
      { label: 'Kind', value: (r) => kindLabel(r.job_kind) },
      { label: 'Duration', value: (r) => r.duration_ms, show: formatMs },
      { label: 'Started', value: (r) => r.started_at ?? r.created_at, show: time }
    ], meta.runs, (r) => openLink(r.url), { noun: 'run', url: meta.url }));
  }

  const ROWS_INLINE = 8;

  // A diff's text with its patch lines coloured; the `---`/`+++` labels before the first
  // hunk are dropped.
  function patchView(text) {
    let inHunk = false;
    const nodes = [];
    for (const line of text.split('\n')) {
      if (line.startsWith('@@')) inHunk = true;
      if (!inHunk && /^(--- |\+\+\+ |=+$)/.test(line)) continue;
      const kind = line.startsWith('=== ') ? 'file'
        : line.startsWith('@@') ? 'hunk'
        : !inHunk ? 'note'
        : line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del' : '';
      nodes.push(el('div', { class: kind }, line || ' '));
    }
    return el('div', { class: 'patch' }, ...nodes);
  }

  // The model hears of each deploy: a context update replaces the previous one, so it
  // names every deploy made from this card.
  const deployed = [];

  function reviewBody(item) {
    if (item.error) return el('div', { class: 'error-line' }, item.error);
    // Too large to draw here, but still deployable: its counts say what it changes.
    if (item.too_large) return el('div', { class: 'step' }, `Too large to display here (+${item.added} -${item.removed} lines). Review it in Windmill before deploying.`);
    if (item.patch == null) return el('div', { class: 'step' }, item.note ?? '');
    // The diffs are drawn in fullscreen alone, which has the room for them whole.
    return patchView(item.patch);
  }

  const typeLabel = (item) => (item.trigger_kind ? `${item.trigger_kind} trigger` : item.type);

  function reviewItem(workspace, item) {
    const done = el('span', { class: 'badge success', hidden: !item.deployed }, 'Deployed');
    const error = el('div', { class: 'form-error', hidden: true });
    const deploy = el('button', { class: 'primary small', type: 'button', hidden: item.digest == null || item.deployed }, 'Deploy');
    let body = reviewBody(item);
    const { type, path, trigger_kind } = item;
    const address = { type, path, ...(trigger_kind ? { trigger_kind } : {}) };
    deploy.onclick = async () => {
      deploy.disabled = true;
      error.hidden = true;
      try {
        // The draft may have changed since it was shown: what would be deployed is read
        // again, and a different diff is shown in place of deploying it.
        const check = await callTool('show_deploy_review', { workspace_id: workspace, items: [address] });
        const current = check?._meta?.['windmill/review']?.items?.[0];
        if (!current || current.digest !== item.digest) {
          Object.assign(item, { patch: undefined, note: undefined, error: undefined, digest: undefined, too_large: undefined }, current ?? { error: 'The draft could not be read again.' });
          const next = reviewBody(item);
          body.replaceWith(next);
          body = next;
          deploy.hidden = item.digest == null;
          error.hidden = false;
          error.textContent = item.digest == null
            ? 'The draft changed since it was shown, and cannot be deployed from here.'
            : 'The draft changed since it was shown. Review the diff above, then press Deploy again.';
          deploy.disabled = false;
          return;
        }
        const result = await callTool('deploy_workspace_item', { workspace_id: workspace, ...address });
        if (result?.isError) throw new Error(textOf(result));
        item.deployed = true;
        deploy.hidden = true;
        done.hidden = false;
        deployed.push(`${typeLabel(item)} ${item.name ?? item.path}`);
        request('ui/update-model-context', {
          content: [{ type: 'text', text: `From the review card, the user deployed: ${deployed.join(', ')}.` }]
        }).catch(() => {});
      } catch (e) {
        error.hidden = false;
        error.textContent = e?.message || 'The deploy failed.';
        deploy.disabled = false;
      }
    };
    return el('section', { class: 'item' },
      el('div', { class: 'item-head' },
        el('span', { class: 'grow' }, item.name ?? item.path),
        el('span', { class: 'dim' }, typeLabel(item)),
        done,
        item.url ? linkButton(item.editor ? 'Open in editor' : 'Open in Windmill', item.url) : null,
        deploy),
      body,
      error);
  }

  function summaryRow(item) {
    let state;
    if (item.deployed) state = el('span', { class: 'badge success' }, 'Deployed');
    else if (item.digest != null) {
      state = el('span', {}, el('span', { class: 'add-count' }, `+${item.added}`), ' ', el('span', { class: 'del-count' }, `-${item.removed}`));
    } else state = el('span', { class: 'dim' }, item.error ? 'Cannot be diffed' : 'Not deployable here');
    // A draft the card cannot deploy says why, under its link to Windmill.
    const why = item.digest == null && !item.deployed ? el('span', { class: 'why' }, item.error ?? item.note ?? '') : null;
    return el(item.url ? 'button' : 'div', {
      class: 'summary-row', type: item.url ? 'button' : null, title: item.url ? (item.editor ? 'Open in editor' : 'Open in Windmill') : null,
      onclick: item.url ? () => openLink(item.url) : null
    },
      el('span', { class: 'grow' }, item.name ?? item.path, ' ', item.url ? icon('external') : null),
      el('span', { class: 'dim' }, typeLabel(item)),
      state,
      why);
  }

  // Inline the review is a summary: whole diffs would outgrow the height hosts give an
  // inline card. They and their Deploy buttons open fullscreen; on a host without it each
  // draft links to its editor, where it is deployed.
  let review = null;

  function renderReview(meta) {
    view = 'review';
    review = meta;
    clearRun();
    const n = meta.items.length;
    setHeader({ summary: 'Review before deploying', ws: meta.workspace, kind: n === 1 ? '1 draft' : `${n} drafts`, url: meta.url, kindIcon: 'review' });
    const full = fullscreen();
    $('review').hidden = full || !canFullscreen() || !meta.items.some((item) => item.digest != null && !item.deployed);
    $('body').replaceChildren(...(!n
      ? [el('div', { class: 'step' }, 'No drafts differ from the deployed state.')]
      : full
        ? meta.items.map((item) => reviewItem(meta.workspace, item))
        : [el('div', { class: 'rows' }, ...meta.items.map(summaryRow))]));
  }

  $('review').addEventListener('click', () => setDisplayMode('fullscreen'));

  function redraw() {
    if (view === 'run' && run) renderRun();
    else if (view === 'review' && review) renderReview(review);
    else if (view === 'runs' && runsMeta) renderRuns(runsMeta);
    else if (view === 'item' && itemMeta) renderItem(itemMeta);
  }

  // ---------------------------------------------------------------- item

  const SENSITIVE = /pass|secret|token|key|private|credential/i;
  const CODE_LINES_INLINE = 20;

  function row(key, value) {
    return el('div', { class: 'row' }, el('span', { class: 'k' }, key), el('span', { class: 'v' }, value));
  }
  // A long value is cut inline, so a row stays one or two lines; fullscreen shows it whole.
  const VALUE_CHARS_INLINE = 200;
  function display(value) {
    if (value == null) return '';
    const text = typeof value === 'string' ? value : JSON.stringify(value);
    return fullscreen() || text.length <= VALUE_CHARS_INLINE ? text : `${text.slice(0, VALUE_CHARS_INLINE)}\u2026`;
  }
  function inputRows(schema) {
    const properties = schema?.properties ?? {};
    const required = new Set(schema?.required ?? []);
    return Object.entries(properties).map(([name, prop]) =>
      row(`${name}${required.has(name) ? ' *' : ''}`, [prop.type ?? 'any', prop.format, prop.description].filter(Boolean).join(' · ')));
  }
  function moduleRows(modules) {
    return (modules ?? []).map((module) => el('div', { class: 'row' },
      el('span', { class: 'v' }, module.id ?? ''),
      el('span', { class: 'grow' }, module.summary || module.value?.path || ''),
      el('span', { class: 'dim' }, module.value?.type ?? '')));
  }
  // Rows past the inline count open fullscreen, or the item in Windmill.
  function capped(rows, noun, url) {
    const shown = fullscreen() ? rows : rows.slice(0, ROWS_INLINE);
    const hidden = rows.length - shown.length;
    return el('div', {}, el('div', { class: 'rows' }, ...shown),
      hidden > 0 ? moreButton(`${hidden} more ${noun}${hidden === 1 ? '' : 's'}`, url) : null);
  }
  const plural = (n, noun) => `${n} ${noun}${n === 1 ? '' : /(s|sh|ch|x)$/.test(noun) ? 'es' : 's'}`;

  // Inline an item shows a few key settings; the rest are collapsed sections.
  let itemMeta = null;
  const FLOW_STEPS_INLINE = 5;

  function renderItem(meta) {
    view = 'item';
    itemMeta = meta;
    clearRun();
    const item = meta.item;
    const value = item.value ?? {};
    const type = item.type;
    const draft = !!item.isDraft;
    const url = draft && meta.edit_url ? meta.edit_url : meta.url;
    const kind = item.triggerKind ? `${item.triggerKind} trigger`
      : type === 'script' && item.language ? `${item.language} script` : type;
    const kindIcon = type === 'trigger' && item.triggerKind === 'http' ? 'http' : ICONS[type] ? type : null;
    setHeader({
      path: item.path, ws: meta.workspace, kind, summary: item.summary, kindIcon,
      status: draft ? 'running' : null, label: draft ? 'Draft' : null, url
    });
    $('review').hidden = true;
    const blocks = [];
    // Sections are fullscreen's: inline a card is one view, so it names what is there.
    const hiddenSections = [];
    const section = (key, label, content) => (fullscreen() ? disclosure(key, label, content) : (hiddenSections.push(label), []));
    const target = value.script_path ? `${value.is_flow ? 'flow' : 'script'} ${value.script_path}` : null;
    switch (type) {
      case 'script': {
        const code = typeof item.value === 'string' ? item.value.split('\n') : [];
        const inputs = inputRows(item.schema);
        if (inputs.length) blocks.push(...section('item-inputs', plural(inputs.length, 'input'), () => capped(inputs, 'input', url)));
        if (code.length) {
          blocks.push(...section('item-code', 'Code', () => {
            const shown = fullscreen() ? code : code.slice(0, CODE_LINES_INLINE);
            return openable(el('pre', {}, shown.join('\n')), shown.length < code.length, url);
          }));
        }
        break;
      }
      case 'flow': {
        // A flow is its steps: the first ones show without opening anything.
        const steps = moduleRows(value.modules);
        const inputs = inputRows(value.schema);
        if (steps.length) {
          const shown = fullscreen() ? steps : steps.slice(0, FLOW_STEPS_INLINE);
          const hidden = steps.length - shown.length;
          blocks.push(el('div', { class: 'section' },
            el('div', { class: 'section-title' }, plural(steps.length, 'step')),
            el('div', { class: 'rows' }, ...shown),
            hidden > 0 ? moreButton(`${hidden} more step${hidden === 1 ? '' : 's'}`, url) : null));
        }
        if (inputs.length) blocks.push(...section('item-inputs', plural(inputs.length, 'input'), () => capped(inputs, 'input', url)));
        break;
      }
      case 'schedule': {
        const rows = [row('Cron', value.schedule ?? ''), row('Timezone', value.timezone ?? '')];
        if (target) rows.push(row('Runs', target));
        rows.push(row('Enabled', String(value.enabled ?? '')));
        blocks.push(el('div', { class: 'rows' }, ...rows));
        if (value.args && Object.keys(value.args).length) {
          blocks.push(...section('item-args', 'Arguments', () => {
            const lines = JSON.stringify(value.args, null, 2).split('\n');
            const shown = fullscreen() ? lines : lines.slice(0, CODE_LINES_INLINE);
            return openable(el('pre', {}, shown.join('\n')), shown.length < lines.length, url);
          }));
        }
        break;
      }
      case 'trigger': {
        const rows = [];
        if (target) rows.push(row('Runs', target));
        if (value.mode != null) rows.push(row('Mode', value.mode));
        else if (value.enabled != null) rows.push(row('Enabled', String(value.enabled)));
        if (rows.length) blocks.push(el('div', { class: 'rows' }, ...rows));
        const skip = new Set(['path', 'summary', 'description', 'script_path', 'is_flow', 'mode', 'enabled', 'workspace_id', 'edited_by', 'edited_at', 'extra_perms', 'email', 'labels', 'permissioned_as', 'error', 'last_server_ping', 'server_id']);
        const settings = Object.entries(value)
          .filter(([k, v]) => !skip.has(k) && v != null && v !== '' && !(Array.isArray(v) && !v.length))
          .map(([k, v]) => row(k, display(v)));
        if (settings.length) blocks.push(...section('item-settings', 'Settings', () => capped(settings, 'setting', url)));
        break;
      }
      case 'resource': {
        const fields = value.value && typeof value.value === 'object' ? Object.entries(value.value) : [];
        // Shown at a glance, so a secret-looking field is masked unless it only names one.
        const rows = [row('Type', value.resource_type ?? ''), ...fields.map(([k, field]) => {
          const reference = typeof field === 'string' && /^\$(var|res):/.test(field);
          return row(k, SENSITIVE.test(k) && !reference ? '\u2022\u2022\u2022\u2022\u2022\u2022' : display(field));
        })];
        blocks.push(capped(rows, 'field', url));
        break;
      }
    }
    if (hiddenSections.length && canFullscreen()) {
      blocks.push(el('button', { class: 'more-line', type: 'button', onclick: () => setDisplayMode('fullscreen') }, hiddenSections.join(' \u00b7 '), icon('maximize')));
    }
    $('body').replaceChildren(...blocks.filter(Boolean));
    $('expand').hidden = !canFullscreen() || fullscreen();
  }

  // ---------------------------------------------------------------- dispatch

  function onResult(result) {
    const meta = result?._meta ?? {};
    if (meta['windmill/review']) return renderReview(meta['windmill/review']);
    if (meta['windmill/runs']) return renderRuns(meta['windmill/runs']);
    if (meta['windmill/item']) return renderItem(meta['windmill/item']);
    if (meta['windmill/run']) return onRun(meta['windmill/run']);
    // A poll that failed (the job read erred) keeps the run's last state.
    if (!run?.id) renderText(result ?? {});
    else refreshFailed();
  }

  function applyContext(context) {
    if (!context) return;
    const modeChanged = context.displayMode && context.displayMode !== host.displayMode;
    host = { ...host, ...context };
    if (modeChanged) redraw();
    if (context.theme) document.documentElement.dataset.theme = context.theme;
    for (const [name, value] of Object.entries(context.styles?.variables ?? {})) {
      if (value) document.documentElement.style.setProperty(name, value);
    }
    // The host's `@font-face` rules for the fonts its `--font-*` variables name.
    const fonts = context.styles?.css?.fonts;
    if (fonts) {
      const style = document.getElementById('host-fonts') ?? document.head.appendChild(el('style', { id: 'host-fonts' }));
      style.textContent = fonts;
    }
  }

  $('path').addEventListener('click', () => openLink($('path').dataset.url));
  $('expand').append(icon('maximize'));
  $('expand').addEventListener('click', () => setDisplayMode('fullscreen'));

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id != null && pending.has(message.id) && !message.method) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    switch (message.method) {
      case 'ui/notifications/tool-input':
        toolArgs = message.params?.arguments ?? {};
        if (!view && toolArgs.path) $('path').textContent = toolArgs.path;
        break;
      case 'ui/notifications/tool-result':
        pollStarted = Date.now();
        onResult(message.params);
        break;
      case 'ui/notifications/tool-cancelled':
        if (!view) {
          run = { status: 'not_started', result: message.params?.reason ?? null };
          view = 'run';
          renderRun();
        }
        break;
      case 'ui/notifications/host-context-changed':
        applyContext(message.params);
        break;
      case 'ui/resource-teardown':
        window.clearTimeout(pollTimer);
        window.clearInterval(tickTimer);
        if (message.id != null) post({ id: message.id, result: {} });
        break;
    }
  });

  // The content's own height: the document's never drops below the frame it is in, so a
  // card that shrinks would keep its old height.
  const main = document.querySelector('main');
  new ResizeObserver(() => {
    post({
      method: 'ui/notifications/size-changed',
      params: { width: document.documentElement.scrollWidth, height: Math.ceil(main.getBoundingClientRect().height) }
    });
  }).observe(main);

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'windmill-card', version: '1.0.0' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }
  }).then((result) => {
    applyContext(result?.hostContext);
    post({ method: 'ui/notifications/initialized', params: {} });
  }).catch(() => {});
})();
</script>
</body>
</html>
