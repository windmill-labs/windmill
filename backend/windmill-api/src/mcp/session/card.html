<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windmill</title>
<!--
  The MCP Apps view the session's show tools draw (`CARD_URI` in `mod.rs`, `views.rs`): a
  run, a table of runs, or drafts to review before deploying, from whichever of
  `_meta["windmill/run" | "windmill/runs" | "windmill/review"]` the result carries. It holds no credential: it acts by calling tools
  through the host, as the user the connection belongs to. Everything it shows is set as
  text, never as markup: a run's result is whatever its script returned.
-->
<style>
  /* Colours, fonts and radii come from the host's style variables when it sends them, so the
     card reads as part of the host; the fallbacks are Windmill's palette. The accent stays
     Windmill's: hosts allow a brand accent on the primary action only. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #efeff4);
    --fg: var(--color-text-primary, #1d2430);
    --fg-2: var(--color-text-secondary, #3d4758);
    --fg-3: var(--color-text-tertiary, #718096);
    --line: var(--color-border-tertiary, #e5e7eb);
    --info-bg: var(--color-background-info, #e9ecfe);
    --info-fg: var(--color-text-info, #183faf);
    --ok-bg: var(--color-background-success, #dcfce7);
    --ok-fg: var(--color-text-success, #3b7a5b);
    --bad-bg: var(--color-background-danger, #fee2e2);
    --bad-fg: var(--color-text-danger, #693237);
    --accent: #758ff8;
    --accent-hover: #5074f6;
    --radius: var(--border-radius-md, 6px);
    --sans: var(--font-sans, Inter, system-ui, -apple-system, sans-serif);
    --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #2e3441);
      --bg-2: var(--color-background-secondary, #272c35);
      --fg: var(--color-text-primary, #eeeff2);
      --fg-2: var(--color-text-secondary, #d4d7dd);
      --fg-3: var(--color-text-tertiary, #a9b0ba);
      --line: var(--color-border-tertiary, #374457);
      --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
      --info-fg: var(--color-text-info, #c7cefc);
      --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
      --ok-fg: var(--color-text-success, #dcfce7);
      --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
      --bad-fg: var(--color-text-danger, #fee2e2);
      --accent: #7085db;
      --accent-hover: #5670d5;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #2e3441);
    --bg-2: var(--color-background-secondary, #272c35);
    --fg: var(--color-text-primary, #eeeff2);
    --fg-2: var(--color-text-secondary, #d4d7dd);
    --fg-3: var(--color-text-tertiary, #a9b0ba);
    --line: var(--color-border-tertiary, #374457);
    --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
    --info-fg: var(--color-text-info, #c7cefc);
    --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
    --ok-fg: var(--color-text-success, #dcfce7);
    --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
    --bad-fg: var(--color-text-danger, #fee2e2);
    --accent: #7085db;
    --accent-hover: #5670d5;
  }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.4 var(--sans); color: var(--fg); }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  .head { display: flex; align-items: flex-start; gap: 12px; }
  .title { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .path { font: 600 14px/1.3 var(--mono); overflow-wrap: anywhere; text-align: left; }
  button.path { border: 0; padding: 0; min-height: 0; background: none; color: inherit; cursor: pointer; }
  button.path:hover { background: none; text-decoration: underline; }
  button.path::after { content: " \2197"; font-family: var(--sans); color: var(--fg-3); }
  button.path:disabled { opacity: 1; cursor: default; text-decoration: none; }
  button.path:disabled::after { content: none; }
  .icon { flex: none; min-height: 28px; width: 28px; padding: 0; font-size: 15px; line-height: 1; }
  .disclosure { align-self: flex-start; border: 0; padding: 0; min-height: 0; background: none; font-size: 12px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .disclosure:hover { background: none; color: var(--fg); }
  .disclosure:disabled { opacity: 1; }
  .disclosure::before { content: "\25B8  "; }
  .disclosure[aria-expanded="true"]::before { content: "\25BE  "; }
  .summary-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 10px; font-size: 13px; }
  .summary-row + .summary-row { border-top: 1px solid var(--line); }
  button.summary-row { width: 100%; min-height: 0; border: 0; border-radius: 0; background: transparent; font: inherit; color: inherit; text-align: left; }
  button.summary-row:hover { background: var(--bg-2); }
  .summary-row .grow { flex: 1; min-width: 0; font: 12px var(--mono); overflow-wrap: anywhere; }
  .summary-row .why { flex-basis: 100%; font-size: 12px; color: var(--fg-2); }
  .add-count { color: var(--ok-fg); font: 12px var(--mono); }
  .del-count { color: var(--bad-fg); font: 12px var(--mono); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); }
  .ws { background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg-2); font-weight: 500; }
  .pill, .badge { flex: none; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
  .pill { margin-left: auto; }
  .success, .pill.success { background: var(--ok-bg); color: var(--ok-fg); }
  .failure, .canceled, .not_started, .pill.failure, .pill.canceled, .pill.not_started { background: var(--bad-bg); color: var(--bad-fg); }
  .step { font-size: 13px; color: var(--fg-2); }
  .step code { font-family: var(--mono); }
  pre { margin: 0; padding: 10px 12px; border-radius: var(--radius); background: var(--bg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.clip { max-height: 180px; overflow: hidden; }
  pre.error { background: var(--bad-bg); color: var(--bad-fg); }
  .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 10px; font-size: 13px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.nested { padding-left: 28px; }
  .row .v { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
  .row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .dim { color: var(--fg-3); font-size: 12px; }
  .row pre { flex-basis: 100%; padding: 6px 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--info-fg); }
  .dot.success { background: var(--ok-fg); }
  .dot.failure, .dot.canceled { background: var(--bad-fg); }
  .dot.skipped { background: var(--fg-3); }
  .patch { font: 12px/1.45 var(--mono); padding: 6px 0; background: var(--bg-2); border-radius: var(--radius); overflow-wrap: anywhere; }
  .patch div { padding: 0 12px; white-space: pre-wrap; }
  .patch .add { background: var(--ok-bg); color: var(--ok-fg); }
  .patch .del { background: var(--bad-bg); color: var(--bad-fg); }
  .patch .hunk { color: var(--info-fg); }
  .patch .file { font-weight: 600; color: var(--fg); padding-top: 8px; }
  .patch .note { color: var(--fg-2); font-family: var(--sans); }
  .table { border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--fg-3); padding: 6px 10px; cursor: pointer; white-space: nowrap; user-select: none; }
  td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  td.mono { font: 12px var(--mono); }
  tr.link { cursor: pointer; }
  tr.link:hover td { background: var(--bg-2); }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .item + .item { border-top: 1px solid var(--line); padding-top: 10px; }
  .item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .item-head .grow { flex: 1; min-width: 0; font: 600 13px var(--mono); overflow-wrap: anywhere; }
  button.small { min-height: 26px; padding: 0 10px; font-size: 12px; }
  .form-error { color: var(--bad-fg); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 500 13px var(--sans); min-height: 32px; padding: 0 12px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  button:hover:not(:disabled) { background: var(--bg-2); }
  button.primary { background: var(--accent); color: #ffffff; border-color: transparent; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="head">
    <div class="title">
      <button class="path" id="path" type="button" disabled>Windmill</button>
      <div class="meta">
        <span class="ws" id="ws" hidden></span>
        <span id="kind"></span>
        <span id="duration"></span>
      </div>
    </div>
    <span class="pill" id="status" hidden></span>
    <button class="icon" id="expand" type="button" title="Full screen" aria-label="Full screen" hidden>&#x2922;</button>
  </div>
  <div class="step" id="step" hidden></div>
  <div class="step" id="stale" hidden>No longer refreshing here. Open it in Windmill for its live status.</div>
  <pre class="clip" id="result" hidden></pre>
  <div id="result-more"></div>
  <div id="result-table"></div>
  <div id="body"></div>
  <section class="card" id="details" style="padding: 0" hidden></section>
  <div class="actions">
    <button id="cancel" type="button" hidden>Cancel run</button>
    <button class="primary" id="review" type="button" hidden>Review and deploy</button>
  </div>
</main>
<script>
(() => {
  // Every poll is a tool call the server serves with a freshly minted token, which lands in
  // the API's shared auth cache: polls back off and stop after ten minutes (~50 per card).
  const MAX_POLL_MS = 10 * 60 * 1000;
  const pollDelay = (age) => (age < 10_000 ? 2_000 : age < 60_000 ? 5_000 : 15_000);
  const RUNNING = ['running', 'queued', 'suspended'];
  const LABELS = {
    running: 'Running', queued: 'Queued', suspended: 'Waiting', success: 'Success',
    failure: 'Failed', canceled: 'Canceled', skipped: 'Skipped', not_started: 'Not started',
    step: 'Step result', in_progress: 'Running'
  };
  const $ = (id) => document.getElementById(id);

  let nextId = 1;
  const pending = new Map();
  let host = {};
  let toolArgs = {};
  let view = null;
  let run = null;
  let pollStarted = 0;
  let pollTimer = null;
  let tickTimer = null;

  function post(message) {
    window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  }
  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function callTool(name, args) {
    return request('tools/call', { name, arguments: args });
  }
  function textOf(result) {
    return (result?.content ?? []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  }
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    node.append(...children.filter((c) => c != null && c !== false));
    return node;
  }
  const KINDS = { preview: 'script test', flowpreview: 'flow test', flowscript: 'flow step', flowdependencies: 'flow dependencies' };
  const kindLabel = (kind) => (kind ? KINDS[kind] ?? kind : '');

  function formatMs(ms) {
    if (ms == null || ms < 0) return '';
    if (ms < 1000) return `${Math.round(ms)}ms`;
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  }

  function canFullscreen() {
    return (host.availableDisplayModes ?? []).includes('fullscreen');
  }
  const fullscreen = () => host.displayMode === 'fullscreen';

  // What does not fit inline opens fullscreen, or on a host without it the page in
  // Windmill: grown inline it would pass the height hosts cap a card at.
  function moreButton(label, url) {
    if (canFullscreen()) {
      return el('button', { class: 'small', type: 'button', style: 'margin-top: 8px', onclick: () => setDisplayMode('fullscreen') }, `Show ${label} \u2922`);
    }
    if (!url) return null;
    return el('button', { class: 'small', type: 'button', style: 'margin-top: 8px', onclick: () => openLink(url) }, `${label[0].toUpperCase()}${label.slice(1)} in Windmill \u2197`);
  }
  // A section the user opened stays open across redraws; fullscreen opens them all.
  const opened = new Set();

  function disclosure(key, label, content) {
    const open = fullscreen() || opened.has(key);
    const toggle = el('button', {
      class: 'disclosure', type: 'button', 'aria-expanded': String(open), disabled: fullscreen(),
      onclick: () => {
        if (opened.has(key)) opened.delete(key); else opened.add(key);
        redraw();
      }
    }, label);
    return [toggle, open ? content() : null];
  }

  function setDisplayMode(mode) {
    if (mode === 'fullscreen' && !canFullscreen()) return;
    if (mode === (host.displayMode ?? 'inline')) return;
    request('ui/request-display-mode', { mode }).then((result) => {
      if (result?.mode) host.displayMode = result.mode;
      redraw();
    }).catch(() => {});
  }

  // The header names what the card shows and links to it in Windmill: opening a page is
  // neither a tool call nor a conversation turn, so it is no card action.
  function setHeader({ path, ws, kind = '', status = null, label = null, url = null }) {
    $('path').textContent = path || 'Windmill';
    $('path').disabled = !url;
    $('path').dataset.url = url ?? '';
    $('path').title = url ? 'Open in Windmill' : '';
    $('ws').hidden = !ws;
    $('ws').textContent = ws || '';
    $('kind').textContent = kind;
    const pill = $('status');
    pill.hidden = !label;
    pill.className = `pill ${status ?? ''}`;
    pill.textContent = label ?? '';
  }
  // ---------------------------------------------------------------- tables

  function cellText(value) {
    if (value == null) return '';
    if (value instanceof Node || typeof value === 'string') return value;
    const json = JSON.stringify(value);
    return json.length > 200 ? `${json.slice(0, 200)}…` : json;
  }

  // Columns are `{ label, value(row), show?(value), mono? }`; clicking a header sorts by it.
  // Inline it shows `ROWS_INLINE` rows, and `more` (the noun, the page in Windmill) the rest.
  function table(columns, rows, onRow, more) {
    const limit = fullscreen() ? Infinity : ROWS_INLINE;
    let sort = null;
    const key = (value) => (typeof value === 'number' ? value : String(cellText(value) ?? ''));
    const body = el('tbody');
    const draw = () => {
      const sorted = !sort ? rows : [...rows].sort((a, b) => {
        const [x, y] = [key(sort.column.value(a)), key(sort.column.value(b))];
        return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
      });
      body.replaceChildren(...sorted.slice(0, limit).map((row) => el('tr', { class: onRow ? 'link' : null, onclick: onRow && (() => onRow(row)) },
        ...columns.map((column) => {
          const value = column.value(row);
          return el('td', { class: column.mono ? 'mono' : null }, cellText(column.show ? column.show(value) : value));
        }))));
    };
    const head = el('tr', {}, ...columns.map((column) => el('th', {
      onclick: () => {
        sort = { column, dir: sort?.column === column ? -sort.dir : 1 };
        draw();
      }
    }, column.label)));
    draw();
    const hidden = rows.length - Math.min(rows.length, limit);
    return el('div', {},
      el('div', { class: 'table' }, el('table', {}, el('thead', {}, head), body)),
      hidden > 0 ? moreButton(`${hidden} more ${more.noun}${hidden === 1 ? '' : 's'}`, more.url) : null);
  }

  // A result that is a list of records reads better as a table. A result cut short is no
  // longer JSON, and stays text.
  function recordsTable(text) {
    let rows;
    try { rows = JSON.parse(text); } catch { return null; }
    if (!Array.isArray(rows) || !rows.length || rows.length > 100) return null;
    if (!rows.every((row) => row && typeof row === 'object' && !Array.isArray(row))) return null;
    const keys = [...new Set(rows.flatMap(Object.keys))].slice(0, 8);
    return table(keys.map((k) => ({ label: k, value: (row) => row[k] })), rows, null, { noun: 'row', url: run.url });
  }

  // ---------------------------------------------------------------- run

  function elapsed() {
    if (!run) return '';
    if (run.duration_ms != null) return formatMs(run.duration_ms);
    if (run.started_at && RUNNING.includes(run.status)) {
      return formatMs(Date.now() - Date.parse(run.started_at));
    }
    return '';
  }

  function renderRun() {
    const status = run?.status ?? 'running';
    const running = RUNNING.includes(status);
    setHeader({
      path: run?.path ?? (run?.id ? `Run ${run.id.slice(0, 8)}` : 'Windmill run'),
      ws: run?.workspace ?? toolArgs.workspace_id,
      kind: kindLabel(run?.job_kind),
      status,
      label: run ? (LABELS[status] ?? status) : 'Starting',
      url: run?.url
    });
    $('duration').textContent = elapsed();
    if (!running) $('stale').hidden = true;
    const step = $('step');
    step.hidden = !(running && run?.steps);
    if (!step.hidden) {
      step.textContent = `Step ${run.step} of ${run.steps}`;
      if (run.step_id) step.append(' · ', el('code', {}, run.step_id));
    }
    const result = $('result');
    const records = status === 'success' ? recordsTable(run?.result) : null;
    result.hidden = running || run?.result == null || !!records;
    result.textContent = run?.result ?? '';
    result.classList.toggle('error', status === 'failure' || status === 'not_started');
    result.classList.toggle('clip', !fullscreen());
    // Rebuilt only for a new result, so a sort survives the card redrawing.
    const holder = $('result-table');
    const source = records ? `${fullscreen()}:${run.result}` : '';
    if (holder.dataset.source !== source) {
      holder.dataset.source = source;
      holder.replaceChildren(...(records ? [records] : []));
    }
    // A long result is clipped inline; the server also cuts one past its own limit.
    const more = $('result-more');
    more.replaceChildren();
    if (!result.hidden) {
      if (!fullscreen() && result.scrollHeight > result.clientHeight + 1) more.append(moreButton('full result', run.url));
      else if (run.result_cut) more.append(el('button', { class: 'small', type: 'button', onclick: () => openLink(run.url) }, 'Full result in Windmill \u2197'));
    }

    $('cancel').hidden = !(running && run?.id);
    $('review').hidden = true;
    $('expand').hidden = !canFullscreen() || fullscreen() || !(run?.step_list?.length || run?.logs);
    renderDetails();
    window.clearInterval(tickTimer);
    if (running && run?.started_at) tickTimer = window.setInterval(() => {
      $('duration').textContent = elapsed();
    }, 1000);
  }

  function stepRow({ id, label, status, note, duration, result, nested, total }) {
    return el('div', { class: nested ? 'row nested' : 'row' },
      el('span', { class: `dot ${status ?? ''}` }),
      el('span', { class: 'v' }, id),
      el('span', { class: 'grow' }, label ?? ''),
      el('span', { class: 'dim' }, [note, LABELS[status] ?? status ?? '', formatMs(duration)].filter(Boolean).join(' · ')),
      result ? el('pre', { class: status === 'failure' ? 'error' : '' }, total ? `${result}\u2026` : result) : null,
      // The server sends a step result's head; the run page has all of it.
      total ? el('span', { class: 'dim', style: 'flex-basis: 100%' }, `First ${result.length} of ${total} characters: the full result is on the run page.`) : null);
  }

  // A step as the server groups it: a parallel step as its branches, a loop as its iteration
  // counts (with the failed iterations and the last one shown), a retry as its last attempt.
  function stepRows(step, last) {
    const parts = step.branches ?? step.iterations_shown ?? [];
    // A failed iteration or branch fails the step only when it stopped the run, which makes
    // it the last step that ran: one set to skip failures carries on.
    const failed = step.failed_iterations || parts.some((p) => ['failure', 'canceled'].includes(p.status));
    const status = step.status
      ?? (step.unfinished || parts.some((p) => RUNNING.includes(p.status)) ? 'running'
        : failed && last && ['failure', 'canceled'].includes(run.status) ? 'failure' : 'success');
    if (step.branches) {
      return [
        stepRow({ id: step.step, status, note: `${step.branches.length} branches` }),
        ...step.branches.map((branch, i) => stepRow({
          id: `branch ${i + 1}`, status: branch.status, duration: branch.duration_ms, result: branch.result, total: branch.result_total_chars, nested: true
        }))
      ];
    }
    if (step.iterations != null) {
      const shown = parts.find((p) => p.status === 'failure') ?? parts.at(-1);
      return [stepRow({
        id: step.step, status, result: shown?.result, total: shown?.result_total_chars,
        note: [
          `${step.iterations} iterations`, `${step.ok} ok`,
          step.failed_iterations && `failed: ${step.failed_iterations.join(', ')}`
        ].filter(Boolean).join(' · ')
      })];
    }
    return [stepRow({
      id: step.step, status, duration: step.duration_ms, result: step.result, total: step.result_total_chars,
      label: step.label?.startsWith(`Step ${step.step}`) ? '' : step.label,
      note: step.attempts > 1 ? `${step.attempts} attempts` : ''
    })];
  }

  // Steps and logs are collapsed sections inline, so the card stays short; fullscreen shows
  // them open.
  function renderDetails() {
    const details = $('details');
    const steps = run?.step_list ?? [];
    // A flow's error handler runs after the step that failed it: that step is the last
    // one before the handler.
    const lastRan = steps.findLastIndex((step) => step.step !== 'failure');
    const children = [];
    if (steps.length) {
      children.push(...disclosure('steps', steps.length === 1 ? '1 step' : `${steps.length} steps`, () => {
        const shown = fullscreen() ? steps : steps.slice(0, STEPS_INLINE);
        const more = steps.length - shown.length;
        return el('div', {},
          el('div', { class: 'rows' }, ...shown.flatMap((step, i) => stepRows(step, i === lastRan))),
          more > 0 ? moreButton(`${more} more step${more === 1 ? '' : 's'}`, run.url) : null);
      }));
    }
    if (run?.logs) {
      children.push(...disclosure('logs', 'Logs', () => {
        const lines = run.logs.split('\n');
        // A log cut to its end starts mid-line, unless that line is all there is.
        if (run.logs_cut && lines.length > 1) lines.shift();
        const shown = fullscreen() ? lines : lines.slice(-LOG_LINES_INLINE);
        const hidden = lines.length - shown.length;
        // The server sends a log's end: earlier lines are only on the run page.
        const earlier = run.logs_cut;
        return el('div', {},
          earlier && fullscreen() ? el('button', { class: 'small', type: 'button', style: 'margin-bottom: 8px', onclick: () => openLink(run.url) }, 'Earlier lines in Windmill \u2197') : null,
          el('pre', {}, shown.join('\n')),
          hidden > 0 || (earlier && !fullscreen()) ? moreButton(hidden > 0 ? `${hidden} earlier line${hidden === 1 ? '' : 's'}` : 'Earlier lines', run.url) : null);
      }));
    }
    if (run?.unreadable) children.push(el('div', { class: 'step' }, 'The details could not be read. Open the run in Windmill.'));
    details.hidden = !children.length;
    details.replaceChildren(...children.filter(Boolean));
  }

  // A tool result without a run, shown as the model got it: a call that started nothing,
  // or a `get_run` drilling into one step.
  function renderText(result) {
    const inspected = toolArgs.id && !result.isError;
    run = { status: inspected ? 'step' : 'not_started', result: textOf(result).slice(0, 1500) };
    view = 'run';
    renderRun();
  }

  function onRun(next) {
    run = next;
    view = 'run';
    renderRun();
    if (RUNNING.includes(run.status)) schedulePoll();
  }

  function schedulePoll() {
    window.clearTimeout(pollTimer);
    const age = Date.now() - pollStarted;
    if (age < MAX_POLL_MS) {
      pollTimer = window.setTimeout(poll, pollDelay(age));
    } else {
      $('stale').hidden = false;
    }
  }

  async function poll() {
    const id = run?.id;
    if (!id) return;
    try {
      const result = await callTool('get_run', { workspace_id: run.workspace, id });
      if (run?.id === id) onResult(result);
    } catch {
      if (run?.id === id) refreshFailed();
    }
  }

  // A finished run's details are read once, so a failed read is said rather than waited on.
  function refreshFailed() {
    if (RUNNING.includes(run.status)) return schedulePoll();
    run.unreadable = true;
    renderRun();
  }

  $('cancel').addEventListener('click', async () => {
    const button = $('cancel');
    button.disabled = true;
    try {
      await callTool('cancel_job', { workspace_id: run.workspace, id: run.id });
    } catch {}
    button.disabled = false;
    window.clearTimeout(pollTimer);
    poll();
  });
  // ---------------------------------------------------------------- runs and review

  // A list view shows none of a run's parts.
  function clearRun() {
    window.clearTimeout(pollTimer);
    window.clearInterval(tickTimer);
    run = null;
    for (const id of ['step', 'stale', 'result', 'details', 'cancel', 'expand']) $(id).hidden = true;
    $('result-more').replaceChildren();
    $('duration').textContent = '';
    $('result-table').replaceChildren();
  }

  function openLink(url) {
    if (url) request('ui/open-link', { url }).catch(() => {});
  }

  let runsMeta = null;

  function renderRuns(meta) {
    view = 'runs';
    runsMeta = meta;
    clearRun();
    setHeader({ path: meta.runs.length === 1 ? '1 run' : `${meta.runs.length} runs`, ws: meta.workspace, url: meta.url });
    $('review').hidden = true;
    const time = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '');
    $('body').replaceChildren(table([
      { label: 'Status', value: (r) => r.status, show: (s) => el('span', { class: `badge ${s ?? ''}` }, LABELS[s] ?? s ?? '') },
      { label: 'Path', value: (r) => r.path ?? r.id, mono: true },
      { label: 'Kind', value: (r) => kindLabel(r.job_kind) },
      { label: 'Duration', value: (r) => r.duration_ms, show: formatMs },
      { label: 'Started', value: (r) => r.started_at ?? r.created_at, show: time }
    ], meta.runs, (r) => openLink(r.url), { noun: 'run', url: meta.url }));
  }

  const PATCH_LINES_INLINE = 40;
  const STEPS_INLINE = 8;
  const ROWS_INLINE = 8;
  const LOG_LINES_INLINE = 15;

  // A diff's text with its patch lines coloured; the `---`/`+++` labels before the first
  // hunk are dropped.
  function patchView(text, limit) {
    const lines = text.split('\n');
    const shown = limit ? lines.slice(0, limit) : lines;
    let inHunk = false;
    const nodes = [];
    for (const line of shown) {
      if (line.startsWith('@@')) inHunk = true;
      if (!inHunk && /^(--- |\+\+\+ |=+$)/.test(line)) continue;
      const kind = line.startsWith('=== ') ? 'file'
        : line.startsWith('@@') ? 'hunk'
        : !inHunk ? 'note'
        : line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del' : '';
      nodes.push(el('div', { class: kind }, line || ' '));
    }
    const patch = el('div', { class: 'patch' }, ...nodes);
    if (limit && lines.length > limit) {
      patch.append(el('div', { class: 'note' }, el('button', {
        type: 'button',
        class: 'small',
        onclick: () => {
          patch.replaceWith(patchView(text));
          setDisplayMode('fullscreen');
        }
      }, `Show all ${lines.length} lines`)));
    }
    return patch;
  }

  // The model hears of each deploy: a context update replaces the previous one, so it
  // names every deploy made from this card.
  const deployed = [];

  function reviewBody(item) {
    if (item.error) return el('pre', { class: 'error' }, item.error);
    if (item.patch == null) return el('div', { class: 'step' }, item.note ?? '');
    // Fullscreen has the room for a whole diff, and Deploy sits under it.
    return patchView(item.patch, fullscreen() ? 0 : PATCH_LINES_INLINE);
  }

  const typeLabel = (item) => (item.trigger_kind ? `${item.trigger_kind} trigger` : item.type);

  function reviewItem(workspace, item) {
    const done = el('span', { class: 'badge success', hidden: !item.deployed }, 'Deployed');
    const error = el('div', { class: 'form-error', hidden: true });
    const deploy = el('button', { class: 'primary small', type: 'button', hidden: item.patch == null || item.deployed }, 'Deploy');
    let body = reviewBody(item);
    const { type, path, trigger_kind } = item;
    const address = { type, path, ...(trigger_kind ? { trigger_kind } : {}) };
    deploy.onclick = async () => {
      deploy.disabled = true;
      error.hidden = true;
      try {
        // The draft may have changed since it was shown: what would be deployed is read
        // again, and a different diff is shown in place of deploying it.
        const check = await callTool('show_deploy_review', { workspace_id: workspace, items: [address] });
        const current = check?._meta?.['windmill/review']?.items?.[0];
        if (!current || current.patch !== item.patch) {
          Object.assign(item, { patch: undefined, note: undefined, error: undefined }, current ?? { error: 'The draft could not be read again.' });
          const next = reviewBody(item);
          body.replaceWith(next);
          body = next;
          deploy.hidden = item.patch == null;
          error.hidden = false;
          error.textContent = item.patch == null
            ? 'The draft changed since it was shown, and cannot be deployed from here.'
            : 'The draft changed since it was shown. Review the diff above, then press Deploy again.';
          deploy.disabled = false;
          return;
        }
        const result = await callTool('deploy_workspace_item', { workspace_id: workspace, ...address });
        if (result?.isError) throw new Error(textOf(result));
        item.deployed = true;
        deploy.hidden = true;
        done.hidden = false;
        deployed.push(`${typeLabel(item)} ${item.name ?? item.path}`);
        request('ui/update-model-context', {
          content: [{ type: 'text', text: `From the review card, the user deployed: ${deployed.join(', ')}.` }]
        }).catch(() => {});
      } catch (e) {
        error.hidden = false;
        error.textContent = e?.message || 'The deploy failed.';
        deploy.disabled = false;
      }
    };
    return el('section', { class: 'item' },
      el('div', { class: 'item-head' },
        el('span', { class: 'grow' }, item.name ?? item.path),
        el('span', { class: 'dim' }, typeLabel(item)),
        done,
        item.url ? el('button', { class: 'small', type: 'button', onclick: () => openLink(item.url) }, item.editor ? 'Open in editor' : 'Open in Windmill') : null,
        deploy),
      body,
      error);
  }

  function lineCounts(patch) {
    let [added, removed, inHunk] = [0, 0, false];
    for (const line of patch.split('\n')) {
      if (line.startsWith('@@')) inHunk = true;
      else if (line.startsWith('=== ')) inHunk = false;
      else if (inHunk && line.startsWith('+')) added++;
      else if (inHunk && line.startsWith('-')) removed++;
    }
    return [added, removed];
  }

  function summaryRow(item) {
    let state;
    if (item.deployed) state = el('span', { class: 'badge success' }, 'Deployed');
    else if (item.patch != null) {
      const [added, removed] = lineCounts(item.patch);
      state = el('span', {}, el('span', { class: 'add-count' }, `+${added}`), ' ', el('span', { class: 'del-count' }, `-${removed}`));
    } else state = el('span', { class: 'dim' }, item.error ? 'Cannot be diffed' : 'Not deployable here');
    // A draft the card cannot deploy says why, under its link to Windmill.
    const why = item.patch == null && !item.deployed ? el('span', { class: 'why' }, item.error ?? item.note ?? '') : null;
    return el(item.url ? 'button' : 'div', {
      class: 'summary-row', type: item.url ? 'button' : null, title: item.url ? (item.editor ? 'Open in editor' : 'Open in Windmill') : null,
      onclick: item.url ? () => openLink(item.url) : null
    },
      el('span', { class: 'grow' }, item.name ?? item.path, item.url ? el('span', { class: 'dim' }, ' \u2197') : null),
      el('span', { class: 'dim' }, typeLabel(item)),
      state,
      why);
  }

  // Inline the review is a summary: whole diffs would outgrow the height hosts give an
  // inline card. They and their Deploy buttons open fullscreen; on a host without it each
  // draft links to its editor, where it is deployed.
  let review = null;

  function renderReview(meta) {
    view = 'review';
    review = meta;
    clearRun();
    const n = meta.items.length;
    setHeader({ path: 'Review before deploying', ws: meta.workspace, kind: n === 1 ? '1 draft' : `${n} drafts`, url: meta.url });
    const full = fullscreen();
    $('review').hidden = full || !canFullscreen() || !meta.items.some((item) => item.patch != null && !item.deployed);
    $('body').replaceChildren(...(!n
      ? [el('div', { class: 'step' }, 'No drafts differ from the deployed state.')]
      : full
        ? meta.items.map((item) => reviewItem(meta.workspace, item))
        : [el('div', { class: 'rows' }, ...meta.items.map(summaryRow))]));
  }

  $('review').addEventListener('click', () => setDisplayMode('fullscreen'));

  function redraw() {
    if (view === 'run' && run) renderRun();
    else if (view === 'review' && review) renderReview(review);
    else if (view === 'runs' && runsMeta) renderRuns(runsMeta);
  }

  // ---------------------------------------------------------------- dispatch

  function onResult(result) {
    const meta = result?._meta ?? {};
    if (meta['windmill/review']) return renderReview(meta['windmill/review']);
    if (meta['windmill/runs']) return renderRuns(meta['windmill/runs']);
    if (meta['windmill/run']) return onRun(meta['windmill/run']);
    // A poll that failed (the job read erred) keeps the run's last state.
    if (!run?.id) renderText(result ?? {});
    else refreshFailed();
  }

  function applyContext(context) {
    if (!context) return;
    const modeChanged = context.displayMode && context.displayMode !== host.displayMode;
    host = { ...host, ...context };
    if (modeChanged) redraw();
    if (context.theme) document.documentElement.dataset.theme = context.theme;
    for (const [name, value] of Object.entries(context.styles?.variables ?? {})) {
      if (value) document.documentElement.style.setProperty(name, value);
    }
    // The host's `@font-face` rules for the fonts its `--font-*` variables name.
    const fonts = context.styles?.css?.fonts;
    if (fonts) {
      const style = document.getElementById('host-fonts') ?? document.head.appendChild(el('style', { id: 'host-fonts' }));
      style.textContent = fonts;
    }
  }

  $('path').addEventListener('click', () => openLink($('path').dataset.url));
  $('expand').addEventListener('click', () => setDisplayMode('fullscreen'));

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id != null && pending.has(message.id) && !message.method) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    switch (message.method) {
      case 'ui/notifications/tool-input':
        toolArgs = message.params?.arguments ?? {};
        if (!view && toolArgs.path) $('path').textContent = toolArgs.path;
        break;
      case 'ui/notifications/tool-result':
        pollStarted = Date.now();
        onResult(message.params);
        break;
      case 'ui/notifications/tool-cancelled':
        if (!view) {
          run = { status: 'not_started', result: message.params?.reason ?? null };
          view = 'run';
          renderRun();
        }
        break;
      case 'ui/notifications/host-context-changed':
        applyContext(message.params);
        break;
      case 'ui/resource-teardown':
        window.clearTimeout(pollTimer);
        window.clearInterval(tickTimer);
        if (message.id != null) post({ id: message.id, result: {} });
        break;
    }
  });

  // The content's own height: the document's never drops below the frame it is in, so a
  // card that shrinks would keep its old height.
  const main = document.querySelector('main');
  new ResizeObserver(() => {
    post({
      method: 'ui/notifications/size-changed',
      params: { width: document.documentElement.scrollWidth, height: Math.ceil(main.getBoundingClientRect().height) }
    });
  }).observe(main);

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'windmill-card', version: '1.0.0' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }
  }).then((result) => {
    applyContext(result?.hostContext);
    post({ method: 'ui/notifications/initialized', params: {} });
  }).catch(() => {});
})();
</script>
</body>
</html>
