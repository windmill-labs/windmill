<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windmill</title>
<!--
  The MCP Apps view of a run started through the session's tools (`CARD_URI` in `mod.rs`),
  drawn from the result's `_meta["windmill/run"]`. It holds no credential: it acts by calling tools
  through the host, as the user the connection belongs to. Everything it shows is set as
  text, never as markup: a run's result is whatever its script returned.
-->
<style>
  /* Colours, fonts and radii come from the host's style variables when it sends them, so the
     card reads as part of the host; the fallbacks are Windmill's palette. The accent stays
     Windmill's: hosts allow a brand accent on the primary action only. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #efeff4);
    --fg: var(--color-text-primary, #1d2430);
    --fg-2: var(--color-text-secondary, #3d4758);
    --fg-3: var(--color-text-tertiary, #718096);
    --line: var(--color-border-tertiary, #e5e7eb);
    --info-bg: var(--color-background-info, #e9ecfe);
    --info-fg: var(--color-text-info, #183faf);
    --ok-bg: var(--color-background-success, #dcfce7);
    --ok-fg: var(--color-text-success, #3b7a5b);
    --bad-bg: var(--color-background-danger, #fee2e2);
    --bad-fg: var(--color-text-danger, #693237);
    --accent: #758ff8;
    --accent-hover: #5074f6;
    --radius: var(--border-radius-md, 6px);
    --sans: var(--font-sans, Inter, system-ui, -apple-system, sans-serif);
    --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #2e3441);
      --bg-2: var(--color-background-secondary, #272c35);
      --fg: var(--color-text-primary, #eeeff2);
      --fg-2: var(--color-text-secondary, #d4d7dd);
      --fg-3: var(--color-text-tertiary, #a9b0ba);
      --line: var(--color-border-tertiary, #374457);
      --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
      --info-fg: var(--color-text-info, #c7cefc);
      --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
      --ok-fg: var(--color-text-success, #dcfce7);
      --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
      --bad-fg: var(--color-text-danger, #fee2e2);
      --accent: #7085db;
      --accent-hover: #5670d5;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #2e3441);
    --bg-2: var(--color-background-secondary, #272c35);
    --fg: var(--color-text-primary, #eeeff2);
    --fg-2: var(--color-text-secondary, #d4d7dd);
    --fg-3: var(--color-text-tertiary, #a9b0ba);
    --line: var(--color-border-tertiary, #374457);
    --info-bg: var(--color-background-info, rgba(24, 71, 210, 0.4));
    --info-fg: var(--color-text-info, #c7cefc);
    --ok-bg: var(--color-background-success, rgba(59, 122, 91, 0.4));
    --ok-fg: var(--color-text-success, #dcfce7);
    --bad-bg: var(--color-background-danger, rgba(129, 56, 63, 0.4));
    --bad-fg: var(--color-text-danger, #fee2e2);
    --accent: #7085db;
    --accent-hover: #5670d5;
  }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.4 var(--sans); color: var(--fg); }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  .head { display: flex; align-items: flex-start; gap: 12px; }
  .title { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .path { font: 600 14px/1.3 var(--mono); overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); }
  .ws { background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg-2); font-weight: 500; }
  .pill { margin-left: auto; flex: none; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--info-bg); color: var(--info-fg); }
  .success, .pill.success { background: var(--ok-bg); color: var(--ok-fg); }
  .failure, .canceled, .not_started, .pill.failure, .pill.canceled, .pill.not_started { background: var(--bad-bg); color: var(--bad-fg); }
  .step { font-size: 13px; color: var(--fg-2); }
  .step code { font-family: var(--mono); }
  pre { margin: 0; padding: 10px 12px; border-radius: var(--radius); background: var(--bg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.clip { max-height: 180px; overflow: hidden; }
  pre.error { background: var(--bad-bg); color: var(--bad-fg); }
  h3 { margin: 4px 0 0; font-size: 12px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 10px; font-size: 13px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.nested { padding-left: 28px; }
  .row .v { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
  .row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .dim { color: var(--fg-3); font-size: 12px; }
  .row pre { flex-basis: 100%; padding: 6px 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--info-fg); }
  .dot.success { background: var(--ok-fg); }
  .dot.failure, .dot.canceled { background: var(--bad-fg); }
  .dot.skipped { background: var(--fg-3); }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  label.check { flex-direction: row; align-items: center; gap: 8px; }
  label small { font-weight: 400; color: var(--fg-3); }
  input, select, textarea { font: 13px var(--sans); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  textarea { font-family: var(--mono); min-height: 60px; resize: vertical; }
  .form-error { color: var(--bad-fg); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 500 13px var(--sans); min-height: 32px; padding: 0 12px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  button:hover:not(:disabled) { background: var(--bg-2); }
  button.primary { background: var(--accent); color: #ffffff; border-color: transparent; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="head">
    <div class="title">
      <div class="path" id="path">Windmill</div>
      <div class="meta">
        <span class="ws" id="ws" hidden></span>
        <span id="kind"></span>
        <span id="duration"></span>
      </div>
    </div>
    <span class="pill" id="status" hidden></span>
  </div>
  <div class="step" id="step" hidden></div>
  <div class="step" id="stale" hidden>No longer refreshing here. Open it in Windmill for its live status.</div>
  <pre class="clip" id="result" hidden></pre>
  <section id="details" hidden></section>
  <form id="form" hidden></form>
  <div class="actions">
    <button class="primary" id="open" hidden>Open in Windmill</button>
    <button id="cancel" hidden>Cancel run</button>
    <button id="toggle-details" hidden>Details</button>
    <button id="toggle-form" hidden>Run with other inputs</button>
  </div>
</main>
<script>
(() => {
  // Every poll is a tool call the server serves with a freshly minted token, which lands in
  // the API's shared auth cache: polls back off and stop after ten minutes (~50 per card).
  const MAX_POLL_MS = 10 * 60 * 1000;
  const pollDelay = (age) => (age < 10_000 ? 2_000 : age < 60_000 ? 5_000 : 15_000);
  const RUNNING = ['running', 'queued', 'suspended'];
  const LABELS = {
    running: 'Running', queued: 'Queued', suspended: 'Waiting', success: 'Success',
    failure: 'Failed', canceled: 'Canceled', skipped: 'Skipped', not_started: 'Not started',
    step: 'Step result', in_progress: 'Running'
  };
  const $ = (id) => document.getElementById(id);

  let nextId = 1;
  const pending = new Map();
  let host = {};
  let toolArgs = {};
  let view = null;
  let run = null;
  let pollStarted = 0;
  let pollTimer = null;
  let tickTimer = null;

  function post(message) {
    window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  }
  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function callTool(name, args) {
    return request('tools/call', { name, arguments: args });
  }
  function textOf(result) {
    return (result?.content ?? []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  }
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    node.append(...children.filter((c) => c != null && c !== false));
    return node;
  }
  function formatMs(ms) {
    if (ms == null || ms < 0) return '';
    if (ms < 1000) return `${Math.round(ms)}ms`;
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  }

  function canFullscreen() {
    return (host.availableDisplayModes ?? []).includes('fullscreen');
  }
  function setDisplayMode(mode) {
    if (mode === 'fullscreen' && !canFullscreen()) return;
    if (mode === 'inline' && host.displayMode !== 'fullscreen') return;
    request('ui/request-display-mode', { mode }).then((result) => {
      if (result?.mode) host.displayMode = result.mode;
    }).catch(() => {});
  }

  function setHeader({ path, ws, kind = '', status = null, label = null }) {
    $('path').textContent = path || 'Windmill';
    $('ws').hidden = !ws;
    $('ws').textContent = ws || '';
    $('kind').textContent = kind;
    const pill = $('status');
    pill.hidden = !label;
    pill.className = `pill ${status ?? ''}`;
    pill.textContent = label ?? '';
  }
  function setOpen(url, label = 'Open in Windmill') {
    const open = $('open');
    open.hidden = !url;
    open.textContent = label;
    open.dataset.url = url ?? '';
  }

  // ---------------------------------------------------------------- run

  function elapsed() {
    if (!run) return '';
    if (run.duration_ms != null) return formatMs(run.duration_ms);
    if (run.started_at && RUNNING.includes(run.status)) {
      return formatMs(Date.now() - Date.parse(run.started_at));
    }
    return '';
  }

  // A form is offered for an input schema the card can fill: a file, at any depth, comes
  // back as a size marker, and a secret not stored as a reference as `<hidden>`, either of
  // which the form would send in place of the value.
  function formFields() {
    const schema = run?.form?.schema;
    if (!schema || /"contentEncoding":\s*"base64"/.test(JSON.stringify(schema))) return null;
    if (JSON.stringify(run.form.args ?? {}).includes('"<hidden>"')) return null;
    const properties = schema.properties ?? {};
    const fields = [...new Set([...(schema.order ?? []), ...Object.keys(properties)])]
      .filter((name) => properties[name])
      .map((name) => [name, properties[name]]);
    // No declared field: the run's arguments are unknown to the card, and would be dropped.
    return fields.length ? fields : null;
  }

  function renderRun() {
    const status = run?.status ?? 'running';
    const running = RUNNING.includes(status);
    setHeader({
      path: run?.path ?? run?.form?.path ?? toolArgs.path ?? (run?.id ? `Run ${run.id.slice(0, 8)}` : 'Windmill run'),
      ws: run?.workspace ?? toolArgs.workspace_id,
      kind: run?.job_kind ? run.job_kind.replace(/preview$/, ' test') : '',
      status,
      label: run ? (LABELS[status] ?? status) : 'Starting'
    });
    $('duration').textContent = elapsed();
    if (!running) $('stale').hidden = true;
    const step = $('step');
    step.hidden = !(running && run?.steps);
    if (!step.hidden) {
      step.textContent = `Step ${run.step} of ${run.steps}`;
      if (run.step_id) step.append(' · ', el('code', {}, run.step_id));
    }
    const result = $('result');
    result.hidden = running || run?.result == null;
    result.textContent = run?.result ?? '';
    result.classList.toggle('error', status === 'failure' || status === 'not_started');

    setOpen(run?.url);
    // Hosts cap an inline card at two actions: the run form lives in the details view.
    const expanded = !$('details').hidden;
    $('cancel').hidden = !(running && run?.id);
    $('toggle-details').hidden = !run?.id || (running && !expanded);
    $('toggle-form').hidden = running || !expanded || !formFields();
    if (!$('details').hidden) renderDetails();
    window.clearInterval(tickTimer);
    if (running && run?.started_at) tickTimer = window.setInterval(() => {
      $('duration').textContent = elapsed();
    }, 1000);
  }

  function stepRow({ id, label, status, note, duration, result, nested }) {
    return el('div', { class: nested ? 'row nested' : 'row' },
      el('span', { class: `dot ${status ?? ''}` }),
      el('span', { class: 'v' }, id),
      el('span', { class: 'grow' }, label ?? ''),
      el('span', { class: 'dim' }, [note, LABELS[status] ?? status ?? '', formatMs(duration)].filter(Boolean).join(' · ')),
      result ? el('pre', { class: status === 'failure' ? 'error' : '' }, result) : null);
  }

  // A step as the server groups it: a parallel step as its branches, a loop as its iteration
  // counts (with the failed iterations and the last one shown), a retry as its last attempt.
  function stepRows(step) {
    const parts = step.branches ?? step.iterations_shown ?? [];
    // A failed iteration or branch fails the step only when it stopped the run: one set to
    // skip failures carries on.
    const failed = step.failed_iterations || parts.some((p) => ['failure', 'canceled'].includes(p.status));
    const status = step.status
      ?? (step.unfinished || parts.some((p) => RUNNING.includes(p.status)) ? 'running'
        : failed && ['failure', 'canceled'].includes(run.status) ? 'failure' : 'success');
    if (step.branches) {
      return [
        stepRow({ id: step.step, status, note: `${step.branches.length} branches` }),
        ...step.branches.map((branch, i) => stepRow({
          id: `branch ${i + 1}`, status: branch.status, duration: branch.duration_ms, result: branch.result, nested: true
        }))
      ];
    }
    if (step.iterations != null) {
      const shown = parts.find((p) => p.status === 'failure') ?? parts.at(-1);
      return [stepRow({
        id: step.step, status, result: shown?.result,
        note: [
          `${step.iterations} iterations`, `${step.ok} ok`,
          step.failed_iterations && `failed: ${step.failed_iterations.join(', ')}`
        ].filter(Boolean).join(' · ')
      })];
    }
    return [stepRow({
      id: step.step, status, duration: step.duration_ms, result: step.result,
      label: step.label?.startsWith(`Step ${step.step}`) ? '' : step.label,
      note: step.attempts > 1 ? `${step.attempts} attempts` : ''
    })];
  }

  function renderDetails() {
    const details = $('details');
    const children = [];
    if (run.step_list?.length) {
      children.push(el('h3', {}, 'Steps'), el('div', { class: 'rows' }, ...run.step_list.flatMap(stepRows)));
    }
    if (run.logs) children.push(el('h3', {}, 'Logs (end)'), el('pre', {}, run.logs));
    if (!children.length) {
      children.push(el('div', { class: 'step' }, run.step_list ? 'Nothing more to show.'
        : run.unreadable ? 'The details could not be read. Open the run in Windmill.' : 'Loading…'));
    }
    details.replaceChildren(...children);
  }

  function renderForm() {
    const form = $('form');
    const fields = formFields() ?? [];
    const args = run.form.args ?? {};
    const required = new Set(run.form.schema?.required ?? []);
    const asText = new Set();
    const inputs = fields.map(([name, prop]) => {
      const value = args[name] ?? prop.default;
      const title = `${prop.title || name}${required.has(name) ? ' *' : ''}`;
      const hint = prop.description ? el('small', {}, prop.description) : null;
      let input;
      // A reference stands for a value of any type; it is shown, and sent, as written.
      const reference = typeof value === 'string' && /^\$(var|res|jsonvar):/.test(value);
      if (reference && !prop.password) {
        asText.add(name);
        input = el('input', { type: 'text', name, value });
        return el('label', {}, title, hint, input);
      }
      if (prop.type === 'boolean') {
        input = el('input', { type: 'checkbox', name, checked: value === true });
        return el('label', { class: 'check' }, input, title, hint);
      }
      if (Array.isArray(prop.enum)) {
        input = el('select', { name },
          required.has(name) ? null : el('option', { value: '' }, ''),
          ...prop.enum.map((option) => el('option', { value: JSON.stringify(option), selected: option === value }, String(option))));
      } else if (prop.type === 'number' || prop.type === 'integer') {
        input = el('input', { type: 'number', name, step: prop.type === 'integer' ? '1' : 'any', value: value ?? '' });
      } else if (prop.type === 'string' && prop.password) {
        input = el('input', { type: 'password', name, placeholder: reference ? 'Unchanged' : '', value: reference ? '' : (value ?? '') });
      } else if (prop.type === 'string') {
        const long = typeof value === 'string' && value.includes('\n');
        input = el(long ? 'textarea' : 'input', { name, value: value ?? '', type: long ? null : (prop.format === 'date' ? 'date' : 'text') });
      } else {
        input = el('textarea', { name, value: value === undefined ? '' : JSON.stringify(value, null, 2) });
      }
      return el('label', {}, title, hint, input);
    });
    const error = el('div', { class: 'form-error', hidden: true });
    const submit = el('button', { class: 'primary', type: 'submit' }, 'Run');
    form.replaceChildren(...inputs, error, el('div', { class: 'actions' }, submit));
    // A field the user left alone is sent exactly as the run had it: a reference, an empty
    // string, a null or an omission would not survive the round trip through an input.
    const touched = new Set();
    // Native validation would judge untouched fields by what their inputs can show.
    form.noValidate = true;
    form.oninput = form.onchange = (event) => touched.add(event.target.name);
    form.onsubmit = async (event) => {
      event.preventDefault();
      const next = {};
      try {
        for (const [name, prop] of fields) {
          const input = form.elements.namedItem(name);
          if (!touched.has(name)) {
            if (name in args) next[name] = args[name];
          } else if (/^\$(var|res|jsonvar):/.test(input.value)) next[name] = input.value;
          else if (asText.has(name)) {
            // A reference replaced by a literal, typed as text whatever the field's type.
            if (input.value !== '') next[name] = prop.type === 'string' ? input.value : JSON.parse(input.value);
          } else if (prop.type === 'boolean') next[name] = input.checked;
          else if (input.value === '') {
            if (prop.password && args[name]) next[name] = args[name];
          } else if (Array.isArray(prop.enum)) next[name] = JSON.parse(input.value);
          else if (prop.type === 'number' || prop.type === 'integer') next[name] = Number(input.value);
          else if (prop.type === 'string') next[name] = input.value;
          else next[name] = JSON.parse(input.value);
        }
      } catch {
        error.hidden = false;
        error.textContent = 'A field holds invalid JSON.';
        return;
      }
      const missing = fields.find(([name, prop]) => required.has(name) && prop.default === undefined
        && (touched.has(name) ? next[name] === undefined || next[name] === '' : !(name in args)));
      if (missing) {
        error.hidden = false;
        error.textContent = `Fill in ${missing[1].title || missing[0]}.`;
        return;
      }
      submit.disabled = true;
      const { tool, path } = run.form;
      const workspace = run.workspace;
      try {
        const result = await callTool(tool, { workspace_id: workspace, path, args: next });
        form.hidden = true;
        $('toggle-form').textContent = 'Run with other inputs';
        pollStarted = Date.now();
        window.clearTimeout(pollTimer);
        run = null;
        onResult(result);
        request('ui/update-model-context', {
          // Only the server's redacted copy of the arguments: `next` may hold a typed secret.
          content: [{ type: 'text', text: `The user ran ${path} again from the Windmill card (${tool})${run?.form?.args ? ` with arguments ${JSON.stringify(run.form.args)}` : ''}: run ${run?.id ?? 'not started'}, status ${run?.status ?? 'unknown'}.` }]
        }).catch(() => {});
      } catch (e) {
        error.hidden = false;
        error.textContent = e?.message ?? 'The run could not be started.';
      }
      submit.disabled = false;
    };
  }

  // A tool result without a run, shown as the model got it: a call that started nothing,
  // or a `get_run` drilling into one step.
  function renderText(result) {
    const inspected = toolArgs.id && !result.isError;
    run = { status: inspected ? 'step' : 'not_started', result: textOf(result).slice(0, 1500) };
    view = 'run';
    renderRun();
  }

  function onRun(next) {
    // A refresh carries the run alone: what the starting call attached stays.
    run = { ...next, form: next.form ?? run?.form };
    view = 'run';
    renderRun();
    if (RUNNING.includes(run.status)) schedulePoll();
  }

  function schedulePoll() {
    window.clearTimeout(pollTimer);
    const age = Date.now() - pollStarted;
    if (age < MAX_POLL_MS) {
      pollTimer = window.setTimeout(poll, pollDelay(age));
    } else {
      $('stale').hidden = false;
    }
  }

  async function poll() {
    const id = run?.id;
    if (!id) return;
    try {
      const result = await callTool('get_run', { workspace_id: run.workspace, id });
      // The form may have started another run while this one was being read.
      if (run?.id === id) onResult(result);
    } catch {
      if (run?.id === id) refreshFailed();
    }
  }

  // A finished run's details are read once, so a failed read is said rather than waited on.
  function refreshFailed() {
    if (RUNNING.includes(run.status)) return schedulePoll();
    run.unreadable = true;
    renderRun();
  }

  $('cancel').addEventListener('click', async () => {
    const button = $('cancel');
    button.disabled = true;
    try {
      await callTool('cancel_job', { workspace_id: run.workspace, id: run.id });
    } catch {}
    button.disabled = false;
    window.clearTimeout(pollTimer);
    poll();
  });
  $('toggle-details').addEventListener('click', () => {
    const details = $('details');
    details.hidden = !details.hidden;
    $('toggle-details').textContent = details.hidden ? 'Details' : 'Hide details';
    if (details.hidden) {
      $('form').hidden = true;
      $('toggle-form').textContent = 'Run with other inputs';
      renderRun();
      return setDisplayMode('inline');
    }
    renderRun();
    setDisplayMode('fullscreen');
    // A run reported by the call that started it has no steps or logs yet.
    if (!run.step_list && !run.logs && !RUNNING.includes(run.status)) poll();
  });
  $('toggle-form').addEventListener('click', () => {
    const form = $('form');
    form.hidden = !form.hidden;
    $('toggle-form').textContent = form.hidden ? 'Run with other inputs' : 'Hide inputs';
    if (!form.hidden) renderForm();
  });

  // ---------------------------------------------------------------- dispatch

  function onResult(result) {
    const meta = result?._meta ?? {};
    if (meta['windmill/run']) return onRun(meta['windmill/run']);
    // A poll that failed (the job read erred) keeps the run's last state.
    if (!run?.id) renderText(result ?? {});
    else refreshFailed();
  }

  function applyContext(context) {
    if (!context) return;
    host = { ...host, ...context };
    if (context.theme) document.documentElement.dataset.theme = context.theme;
    for (const [name, value] of Object.entries(context.styles?.variables ?? {})) {
      if (value) document.documentElement.style.setProperty(name, value);
    }
    // The host's `@font-face` rules for the fonts its `--font-*` variables name.
    const fonts = context.styles?.css?.fonts;
    if (fonts) {
      const style = document.getElementById('host-fonts') ?? document.head.appendChild(el('style', { id: 'host-fonts' }));
      style.textContent = fonts;
    }
  }

  $('open').addEventListener('click', () => {
    const url = $('open').dataset.url;
    if (url) request('ui/open-link', { url }).catch(() => {});
  });

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id != null && pending.has(message.id) && !message.method) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    switch (message.method) {
      case 'ui/notifications/tool-input':
        toolArgs = message.params?.arguments ?? {};
        if (!view && toolArgs.path) $('path').textContent = toolArgs.path;
        break;
      case 'ui/notifications/tool-result':
        pollStarted = Date.now();
        onResult(message.params);
        break;
      case 'ui/notifications/tool-cancelled':
        if (!view) {
          run = { status: 'not_started', result: message.params?.reason ?? null };
          view = 'run';
          renderRun();
        }
        break;
      case 'ui/notifications/host-context-changed':
        applyContext(message.params);
        break;
      case 'ui/resource-teardown':
        window.clearTimeout(pollTimer);
        window.clearInterval(tickTimer);
        if (message.id != null) post({ id: message.id, result: {} });
        break;
    }
  });

  new ResizeObserver(() => {
    post({
      method: 'ui/notifications/size-changed',
      params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight }
    });
  }).observe(document.body);

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'windmill-card', version: '1.0.0' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }
  }).then((result) => {
    applyContext(result?.hostContext);
    post({ method: 'ui/notifications/initialized', params: {} });
  }).catch(() => {});
})();
</script>
</body>
</html>
